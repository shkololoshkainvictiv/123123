<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сверка остатков SAP и WMS</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-y:scroll}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.06);border-radius:4px}
::-webkit-scrollbar-thumb{background:rgba(61,90,158,.35);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(61,90,158,.55)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#e4e5eb;padding:20px;color:#2a2a3a}
.container{max-width:1280px;margin:0 auto}

.back-btn{position:fixed;top:20px;left:20px;z-index:9999;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border:1px solid rgba(0,0,0,.08);box-shadow:4px 6px 16px rgba(30,30,60,.15);cursor:pointer;transition:all .25s;text-decoration:none}
.back-btn:hover{background:#fff;transform:translateX(-3px);box-shadow:6px 8px 20px rgba(30,30,60,.2)}
.back-btn svg{width:22px;height:22px;fill:#3d5a9e}

.header{text-align:center;margin-bottom:28px;padding:24px 20px;background:linear-gradient(135deg,#e85a1e,#ff6f32 50%,#ff8855);border-radius:16px;box-shadow:8px 12px 28px rgba(200,70,20,.35);position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 30% 50%,rgba(255,255,255,.1) 0%,transparent 60%);pointer-events:none}
.header-icon{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.15);backdrop-filter:blur(4px);margin-bottom:12px;border:1px solid rgba(255,255,255,.2);box-shadow:4px 6px 14px rgba(0,0,0,.18);opacity:0;transform:scale(.5);transition:opacity .6s ease,transform .6s cubic-bezier(.34,1.56,.64,1)}
.header-icon.visible{opacity:1;transform:scale(1)}
.header-icon.visible svg{animation:heartbeat 1.2s ease-in-out .3s 3}
@keyframes heartbeat{0%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1)}100%{transform:scale(1)}}
.header-icon svg{width:30px;height:30px;fill:#fff}
.header h1{font-size:22px;color:#fff;font-weight:700;position:relative}
.header .subtitle{font-size:13px;color:rgba(255,255,255,.8);margin-top:6px;position:relative}

.card{background:#f5f5fa;border-radius:16px;padding:24px;margin-bottom:20px;border:1px solid rgba(0,0,0,.06);box-shadow:10px 14px 36px rgba(30,30,60,.18)}
.card h2{font-size:15px;margin-bottom:18px;color:#4a4a65;border-bottom:1px solid rgba(0,0,0,.08);padding-bottom:10px;font-weight:600;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}

.drop-zones{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:768px){.drop-zones{grid-template-columns:1fr}}

.drop-box{background:#dfe0e8;border:2px dashed rgba(61,90,158,.3);border-radius:12px;padding:24px;text-align:center;cursor:pointer;transition:all .25s;position:relative}
.drop-box:hover,.drop-box.dragover{border-color:#3d5a9e;background:#d8d9e4}
.drop-box input{display:none}
.drop-title{font-weight:700;font-size:14px;color:#3d5a9e;margin-bottom:6px;text-transform:uppercase}
.drop-desc{font-size:12px;color:#666680}
.drop-status{font-size:12px;font-weight:600;margin-top:10px;color:#2c6e49;display:none;word-break:break-all}

.status-box{background:#d8d9e4;border-radius:10px;padding:14px 18px;font-family:'Courier New',monospace;font-size:13px;color:#2a2a3a;box-shadow:inset 0 2px 4px rgba(0,0,0,.06);border:1px solid rgba(0,0,0,.05)}
.status-line{white-space:pre-wrap;word-break:break-word;display:none}
.status-line.visible{display:block}
.status-line.error{color:#8b2c2c}

.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:20px}
.tabs{display:flex;gap:8px}
.tab-btn{padding:10px 18px;border-radius:10px;border:none;background:#dfe0e8;color:#555570;font-weight:600;font-size:13px;cursor:pointer;transition:all .2s;box-shadow:2px 4px 10px rgba(0,0,0,.05)}
.tab-btn.active{background:#3d5a9e;color:#fff;box-shadow:4px 6px 14px rgba(61,90,158,.3)}

.view-toggle{display:flex;background:#dfe0e8;padding:3px;border-radius:8px}
.view-btn{padding:6px 12px;border:none;background:transparent;color:#555570;font-weight:600;font-size:12px;border-radius:6px;cursor:pointer;transition:all .2s}
.view-btn.active{background:#fff;color:#1a1a2e;box-shadow:0 2px 5px rgba(0,0,0,.1)}

.search-bar{position:relative;flex:1;max-width:320px;min-width:200px}
.search-bar input{width:100%;padding:10px 14px;border:1px solid rgba(0,0,0,.1);border-radius:10px;font-size:13px;background:#fff;color:#1a1a2e}
.search-bar input:focus{outline:none;border-color:#3d5a9e}

.btn-export{padding:10px 18px;border-radius:10px;border:none;background:#2c6e49;color:#fff;font-weight:600;font-size:13px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;box-shadow:4px 6px 14px rgba(44,110,73,.3)}
.btn-export:hover{background:#23573a;transform:translateY(-1px)}
.btn-export svg{width:16px;height:16px;fill:#fff}

.table-wrapper{overflow-x:auto;max-height:600px;border-radius:12px;border:1px solid rgba(0,0,0,.08);background:#fff;box-shadow:4px 6px 16px rgba(30,30,60,.06);position:relative}
table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}
th{background:#f0f1f7;padding:12px 14px;color:#4a4a65;font-weight:600;border-bottom:1px solid rgba(0,0,0,.08);white-space:nowrap;position:sticky;top:0;z-index:10;box-shadow:0 2px 2px -1px rgba(0,0,0,.1)}
td{padding:10px 14px;border-bottom:1px solid rgba(0,0,0,.05);color:#2a2a3a}
tr:hover{background:rgba(61,90,158,.02)}

.text-center{text-align:center}

.match{background:rgba(44,110,73,.12);color:#1c472e;font-weight:600;border-radius:4px;padding:2px 6px;display:inline-block}
.mismatch{background:rgba(220,38,38,.12);color:#8b2c2c;font-weight:600;border-radius:4px;padding:2px 6px;display:inline-block}
.mismatch-pos{background:rgba(245,158,11,.18);color:#92400e;font-weight:600;border-radius:4px;padding:2px 6px;display:inline-block}

.empty{text-align:center;padding:40px 20px;color:#8a8aa5;font-size:14px}
</style>
</head>
<body>

<a href="http://okkam.space" class="back-btn" title="Назад">
  <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
</a>

<div class="container">
  <div class="header">
    <div class="header-icon" id="headerIcon">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
    </div>
    <h1>Сверка остатков SAP и WMS</h1>
    <div class="subtitle">Сравнение запасов на складах по статусам</div>
  </div>

  <div class="drop-zones">
    <div class="drop-box" id="dropSap" onclick="document.getElementById('fileSap').click()">
      <input type="file" id="fileSap" accept=".xlsx, .xls" onchange="handleFileSelect(this, 'sap')">
      <div class="drop-title">1. Остатки SAP</div>
      <div class="drop-desc">Перетащите сюда XLSX файл или кликните</div>
      <div class="drop-status" id="statusSap"></div>
    </div>
    <div class="drop-box" id="dropWms" onclick="document.getElementById('fileWms').click()">
      <input type="file" id="fileWms" accept=".xlsx, .xls" onchange="handleFileSelect(this, 'wms')">
      <div class="drop-title">2. Остатки WMS</div>
      <div class="drop-desc">Перетащите сюда XLSX файл или кликните</div>
      <div class="drop-status" id="statusWms"></div>
    </div>
  </div>

  <div class="card" id="statusCard" style="display:none">
    <h2>Статус обработки</h2>
    <div class="status-box">
      <div id="statusLine" class="status-line visible"></div>
    </div>
  </div>

  <div class="card">
    <div class="controls">
      <div class="tabs">
        <button class="tab-btn active" id="tabMain" onclick="switchTab('main')">Сверка остатков</button>
        <button class="tab-btn" id="tabOther" onclick="switchTab('other')">Иные результаты</button>
      </div>

      <div class="view-toggle" id="viewToggle">
        <button class="view-btn active" id="btnViewA" onclick="switchView('A')">Сводный</button>
        <button class="view-btn" id="btnViewB" onclick="switchView('B')">Построчный</button>
      </div>

      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Поиск по артикулу или названию..." oninput="renderData()">
      </div>

      <button class="btn-export" onclick="exportExcel()">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        Скачать XLSX
      </button>
    </div>

    <div class="table-wrapper">
      <div id="tableContent">
        <div class="empty">Загрузите файлы SAP и WMS для проведения сверки</div>
      </div>
    </div>
  </div>
</div>

<script>
let rawSap = null;
let rawWms = null;
let parsedSapMain = {};
let parsedSapOther = {};
let parsedWms = {};

let currentTab = 'main';
let currentView = 'A';

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if (e.key === 'F12' || 
     (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) ||
     (e.ctrlKey && e.key.toUpperCase() === 'U')) {
    e.preventDefault();
  }
});

['Sap', 'Wms'].forEach(type => {
  const box = document.getElementById('drop' + type);
  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    box.addEventListener(eventName, e => e.preventDefault(), false);
  });
  ['dragenter', 'dragover'].forEach(eventName => {
    box.addEventListener(eventName, () => box.classList.add('dragover'), false);
  });
  ['dragleave', 'drop'].forEach(eventName => {
    box.addEventListener(eventName, () => box.classList.remove('dragover'), false);
  });
  box.addEventListener('drop', e => {
    const dt = e.dataTransfer;
    const files = dt.files;
    if (files.length) {
      document.getElementById('file' + type).files = files;
      handleFileSelect(document.getElementById('file' + type), type.toLowerCase());
    }
  });
});

function handleFileSelect(input, type) {
  const file = input.files[0];
  if (!file) return;

  const statusEl = document.getElementById('status' + (type === 'sap' ? 'Sap' : 'Wms'));
  statusEl.style.display = 'block';
  statusEl.textContent = '✓ Загружен: ' + file.name;

  const reader = new FileReader();
  reader.onload = function(e) {
    const data = new Uint8Array(e.target.result);
    const workbook = XLSX.read(data, { type: 'array' });

    if (type === 'sap') {
      const sheetNames = workbook.SheetNames;
      const targetSheetName = sheetNames.length > 1 ? sheetNames[sheetNames.length - 1] : sheetNames[0];
      const sheet = workbook.Sheets[targetSheetName];
      rawSap = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
    } else {
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      rawWms = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
    }

    if (rawSap && rawWms) processData();
  };
  reader.readAsArrayBuffer(file);
}

function parseQty(val) {
  if (typeof val === 'number') return isNaN(val) ? 0 : Math.trunc(val);
  if (!val) return 0;
  let str = String(val).trim().replace(/\s/g, '').replace(/\u00a0/g, '');
  if (str.includes('.') && str.includes(',')) {
    str = str.replace(/\./g, '').replace(',', '.');
  } else if (str.includes(',')) {
    str = str.replace(',', '.');
  } else if (str.includes('.')) {
    const parts = str.split('.');
    if (parts.length > 2 || (parts.length === 2 && parts[1].length === 3)) {
      str = str.replace(/\./g, '');
    }
  }
  return Math.trunc(parseFloat(str) || 0);
}

function processData() {
  document.getElementById('statusCard').style.display = 'block';
  const statusLine = document.getElementById('statusLine');
  statusLine.textContent = '→ Выполняется обработка и сверка файлов...';

  setTimeout(() => {
    parseSapData();
    parseWmsData();
    statusLine.textContent = '✓ Сверка завершена успешно!';
    renderData();
  }, 100);
}

function parseSapData() {
  parsedSapMain = {};
  parsedSapOther = {};

  if (!rawSap || rawSap.length <= 1) return; // Пропускаем строку 0 (заголовок)

  for (let i = 1; i < rawSap.length; i++) {
    const row = rawSap[i];
    if (!row || row.length === 0) continue;

    const type = String(row[1] || '').trim().toUpperCase();       // Столбец B
    const subStatus = String(row[2] || '').trim().toUpperCase();  // Столбец C
    const sku = String(row[3] || '').trim();                      // Столбец D
    const name = String(row[4] || '').trim();                     // Столбец E
    const qty = parseQty(row[7]);                                 // Столбец H

    if (!sku) continue;

    let status = null;
    if (type === '100' && subStatus === 'W2') {
      status = 'Кондиция';
    } else if (type === '710' && subStatus === 'DAMAGED') {
      status = 'Брак';
    } else if (type === '710' && subStatus === 'EXPIRED') {
      status = 'Блок';
    } else if (type === '715') {
      status = 'Карантин';
    }

    if (status) {
      if (!parsedSapMain[sku]) {
        parsedSapMain[sku] = { name: name, statuses: {} };
      }
      if (!parsedSapMain[sku].name && name) parsedSapMain[sku].name = name;
      
      if (!parsedSapMain[sku].statuses[status]) {
        parsedSapMain[sku].statuses[status] = 0;
      }
      parsedSapMain[sku].statuses[status] += qty;
    } else {
      // Иные результаты
      const otherKey = `${type}_${subStatus}`;
      if (!parsedSapOther[otherKey]) parsedSapOther[otherKey] = {};
      if (!parsedSapOther[otherKey][sku]) {
        parsedSapOther[otherKey][sku] = { name: name, type: type, subStatus: subStatus, qty: 0 };
      }
      parsedSapOther[otherKey][sku].qty += qty;
    }
  }
}

function parseWmsData() {
  parsedWms = {};

  if (!rawWms || rawWms.length <= 1) return; // Пропускаем строку 0 (заголовок)

  for (let i = 1; i < rawWms.length; i++) {
    const row = rawWms[i];
    if (!row || row.length === 0) continue;

    const sku = String(row[3] || '').trim();       // Столбец D
    const name = String(row[4] || '').trim();      // Столбец E
    const status = String(row[6] || '').trim();    // Столбец G
    const qty = parseQty(row[13]);                 // Столбец N

    if (!sku) continue;

    // Агрегация: если D, E, G одинаковые, qty суммируется в один и тот же ключ
    if (!parsedWms[sku]) {
      parsedWms[sku] = { name: name, statuses: {} };
    }
    if (!parsedWms[sku].name && name) parsedWms[sku].name = name;

    if (!parsedWms[sku].statuses[status]) {
      parsedWms[sku].statuses[status] = 0;
    }
    parsedWms[sku].statuses[status] += qty;
  }
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabMain').classList.toggle('active', tab === 'main');
  document.getElementById('tabOther').classList.toggle('active', tab === 'other');
  document.getElementById('viewToggle').style.display = tab === 'main' ? 'flex' : 'none';
  renderData();
}

function switchView(view) {
  currentView = view;
  document.getElementById('btnViewA').classList.toggle('active', view === 'A');
  document.getElementById('btnViewB').classList.toggle('active', view === 'B');
  renderData();
}

function renderData() {
  const container = document.getElementById('tableContent');
  const search = document.getElementById('searchInput').value.toLowerCase().trim();

  if (!rawSap || !rawWms) {
    container.innerHTML = '<div class="empty">Загрузите файлы SAP и WMS для проведения сверки</div>';
    return;
  }

  if (currentTab === 'main') renderMainTable(container, search);
  else renderOtherTable(container, search);
}

function renderMainTable(container, search) {
  let skus = Object.keys(parsedSapMain);
  if (search) {
    skus = skus.filter(s => s.toLowerCase().includes(search) || parsedSapMain[s].name.toLowerCase().includes(search));
  }

  if (skus.length === 0) {
    container.innerHTML = '<div class="empty">Нет данных по запросу</div>';
    return;
  }

  let html = '';

  if (currentView === 'A') {
    html = `<table>
      <thead>
        <tr>
          <th>Артикул</th>
          <th>Наименование</th>
          <th class="text-center">Кондиция<br>SAP / WMS</th>
          <th class="text-center">Брак<br>SAP / WMS</th>
          <th class="text-center">Блок<br>SAP / WMS</th>
          <th class="text-center">Карантин<br>SAP / WMS</th>
        </tr>
      </thead><tbody>`;

    skus.forEach(sku => {
      const sapItem = parsedSapMain[sku];
      const wmsItem = parsedWms[sku] || { statuses: {} };

      const renderCell = (statusName) => {
        const sapQty = sapItem.statuses[statusName] || 0;
        const wmsQty = wmsItem.statuses[statusName] || 0;
        const isMatch = sapQty === wmsQty;
        const cls = isMatch ? 'match' : (sapQty > wmsQty ? 'mismatch-pos' : 'mismatch');
        return `<span class="${cls}">${sapQty} / ${wmsQty}</span>`;
      };

      html += `<tr>
        <td><b>${sku}</b></td>
        <td>${sapItem.name}</td>
        <td class="text-center">${renderCell('Кондиция')}</td>
        <td class="text-center">${renderCell('Брак')}</td>
        <td class="text-center">${renderCell('Блок')}</td>
        <td class="text-center">${renderCell('Карантин')}</td>
      </tr>`;
    });

    html += `</tbody></table>`;
  } else {
    html = `<table>
      <thead>
        <tr>
          <th>Артикул</th>
          <th>Наименование</th>
          <th class="text-center">Статус</th>
          <th class="text-center">Остаток SAP</th>
          <th class="text-center">Остаток WMS</th>
          <th class="text-center">Разница</th>
        </tr>
      </thead><tbody>`;

    const statusMap = [
      { code: 'Кондиция', name: 'Кондиция' },
      { code: 'Брак', name: 'Брак' },
      { code: 'Блок', name: 'Блок' },
      { code: 'Карантин', name: 'Карантин' }
    ];

    skus.forEach(sku => {
      const sapItem = parsedSapMain[sku];
      const wmsItem = parsedWms[sku] || { statuses: {} };

      statusMap.forEach(st => {
        const sapQty = sapItem.statuses[st.code] || 0;
        const wmsQty = wmsItem.statuses[st.name] || 0;
        const diff = sapQty - wmsQty;
        const isMatch = diff === 0;
        let diffClass = isMatch ? 'match' : (diff > 0 ? 'mismatch-pos' : 'mismatch');

        html += `<tr>
          <td><b>${sku}</b></td>
          <td>${sapItem.name}</td>
          <td class="text-center">${st.name}</td>
          <td class="text-center">${sapQty}</td>
          <td class="text-center">${wmsQty}</td>
          <td class="text-center"><span class="${diffClass}">${diff > 0 ? '+' + diff : diff}</span></td>
        </tr>`;
      });
    });

    html += `</tbody></table>`;
  }

  container.innerHTML = html;
}

function renderOtherTable(container, search) {
  let html = `<table>
    <thead>
      <tr>
        <th class="text-center">Тип / Подстатус SAP</th>
        <th>Артикул</th>
        <th>Наименование</th>
        <th class="text-center">Количество SAP</th>
      </tr>
    </thead><tbody>`;

  let count = 0;

  Object.keys(parsedSapOther).forEach(statusKey => {
    Object.keys(parsedSapOther[statusKey]).forEach(sku => {
      const item = parsedSapOther[statusKey][sku];
      if (search && !sku.toLowerCase().includes(search) && !item.name.toLowerCase().includes(search)) return;

      count++;
      html += `<tr>
        <td class="text-center"><b style="color:#d97706">${item.type || '-'} / ${item.subStatus || '-'}</b></td>
        <td><b>${sku}</b></td>
        <td>${item.name}</td>
        <td class="text-center"><b>${item.qty}</b></td>
      </tr>`;
    });
  });

  html += `</tbody></table>`;

  if (count === 0) {
    container.innerHTML = '<div class="empty">Сюда попадают строки SAP, не соответствующие основным статусам (Кондиция, Брак, Блок, Карантин)</div>';
  } else {
    container.innerHTML = html;
  }
}

function exportExcel() {
  const table = document.querySelector("#tableContent table");
  if (!table) return;

  const dateStr = new Date().toLocaleDateString('ru-RU');
  const titleText = `Сверка баз (${dateStr})`;

  const aoa = [];
  aoa.push([titleText]);
  aoa.push([]);

  const headers = [];
  table.querySelectorAll('thead th').forEach(th => {
    headers.push(th.innerText.replace(/\n/g, ' '));
  });
  aoa.push(headers);

  table.querySelectorAll('tbody tr').forEach(tr => {
    const row = [];
    tr.querySelectorAll('td').forEach(td => {
      row.push(td.innerText);
    });
    aoa.push(row);
  });

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const range = XLSX.utils.decode_range(ws['!ref']);

  if (ws['A1']) {
    ws['A1'].s = { font: { bold: true, sz: 14, color: { rgb: "00000000" } } };
  }

  for (let C = range.s.c; C <= range.e.c; ++C) {
    const cellRef = XLSX.utils.encode_cell({ r: 2, c: C });
    if (ws[cellRef]) {
      ws[cellRef].s = {
        fill: { fgColor: { rgb: "FFFF6F32" } },
        font: { bold: true, color: { rgb: "FFFFFFFF" } },
        alignment: { horizontal: "center", vertical: "center" }
      };
    }
  }

  const colWidths = [];
  for (let C = range.s.c; C <= range.e.c; ++C) {
    let maxLen = 10;
    for (let R = range.s.r; R <= range.e.r; ++R) {
      const cellRef = XLSX.utils.encode_cell({ r: R, c: C });
      const cell = ws[cellRef];
      if (cell && cell.v) {
        const valStr = String(cell.v);
        if (valStr.length > maxLen) maxLen = valStr.length;

        if (R > 2 && C > 1) {
          if (!cell.s) cell.s = {};
          cell.s.alignment = { horizontal: "center", vertical: "center" };
        }
      }
    }
    colWidths.push({ wch: Math.min(maxLen + 4, 60) });
  }
  ws['!cols'] = colWidths;
  ws['!views'] = [{ state: 'frozen', xSplit: 0, ySplit: 3, activeCell: 'A4' }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Отчет");
  XLSX.writeFile(wb, `Sverka_Ostatkov_${currentTab}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    document.getElementById('headerIcon').classList.add('visible');
  }, 500);
});
</script>
</body>
</html>
