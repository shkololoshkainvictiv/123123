<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обработка х5</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-y:scroll}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.06);border-radius:4px}
::-webkit-scrollbar-thumb{background:rgba(61,90,158,.35);border-radius:4px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#e4e5eb;padding:20px;color:#2a2a3a}
.container{max-width:1600px;width:96%;margin:0 auto;position:relative}

.back-btn{position:fixed;top:20px;left:20px;width:46px;height:46px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:7px 9px 20px rgba(30,30,60,.16);transition:all .25s;z-index:1000;text-decoration:none;border:none;cursor:pointer}
.back-btn:hover{background:rgba(61,90,158,.08);transform:translateY(-2px);box-shadow:9px 12px 26px rgba(30,30,60,.22)}
.back-btn svg{width:24px;height:24px;fill:#3d5a9e}

.header{text-align:center;margin-bottom:24px;padding:22px 20px;background:linear-gradient(135deg,#e85a1e 0%,#ff6f32 50%,#ff8855 100%);border-radius:16px;box-shadow:14px 18px 44px rgba(200,70,20,.35);display:flex;flex-direction:column;align-items:center;justify-content:center}
.header-icon-box{width:64px;height:64px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;backdrop-filter:blur(4px);box-shadow:0 8px 16px rgba(0,0,0,.1);animation:floatIcon 3s ease-in-out infinite}
.header-icon-box svg{width:42px;height:42px}
@keyframes floatIcon{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.03)}}
.header h1{font-size:22px;color:#fff;font-weight:700}
.header .subtitle{font-size:13px;color:rgba(255,255,255,.85);margin-top:4px}

.card{background:#f5f5fa;border-radius:16px;padding:24px;margin-bottom:20px;border:1px solid rgba(0,0,0,.06);box-shadow:14px 18px 44px rgba(30,30,60,.15)}
.card h2{font-size:15px;margin-bottom:16px;color:#4a4a65;border-bottom:1px solid rgba(0,0,0,.08);padding-bottom:8px;font-weight:600;text-transform:uppercase}

.form-control{height:42px;padding:0 14px;border-radius:10px;border:1px solid rgba(0,0,0,.15);background:#fff;font-size:14px;color:#1a1a2e;outline:none;transition:all .2s;width:100%}
.form-control:focus{border-color:#e85a1e;box-shadow:0 0 0 3px rgba(232,90,30,.15)}

.upload-zone{border:2px dashed rgba(61,90,158,.4);padding:35px;text-align:center;border-radius:12px;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.6);display:block}
.upload-zone:hover{background:#fff;border-color:#3d5a9e}
.upload-zone input{display:none}
.upload-zone svg{width:40px;height:40px;fill:#3d5a9e;margin-bottom:8px}

#fileDateInfo{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:#3d5a9e;background:#fff;padding:8px 16px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.05);border:1px solid rgba(0,0,0,.05);margin-bottom:14px}
#fileDateInfo span{color:#e85a1e}

.tabs{display:flex;gap:10px;margin-bottom:16px}
.tab-btn{flex:1;height:44px;border-radius:10px;border:1px solid rgba(0,0,0,.1);background:#fff;color:#4a4a65;font-weight:600;cursor:pointer;transition:all .2s;font-size:14px}
.tab-btn.active{background:#e85a1e;color:#fff;border-color:#e85a1e;box-shadow:4px 6px 16px rgba(232,90,30,.25)}

.search-box{margin-bottom:16px}

.group-card{background:#fff;border-radius:12px;border:1px solid rgba(0,0,0,.08);margin-bottom:16px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.04);display:flex;transition:all .2s}
.group-card.pinned{border:2px solid #3d5a9e;box-shadow:0 4px 16px rgba(61,90,158,.18)}

.group-content{flex:1;padding:16px;overflow-x:auto}
.group-actions-sidebar{width:54px;background:#f0f0f5;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:12px;border-left:1px solid rgba(0,0,0,.08);flex-shrink:0}

.sidebar-btn{width:36px;height:36px;border-radius:8px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.08)}
.sidebar-btn:hover{transform:scale(1.05)}
.btn-remove{color:#d9534f}
.btn-remove:hover{background:#d9534f;color:#fff}
.btn-pin{color:#3d5a9e}
.btn-pin.active{background:#3d5a9e;color:#fff}
.btn-group-download{color:#2c6e49}
.btn-group-download:hover:not(:disabled){background:#2c6e49;color:#fff}
.btn-group-download:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}

.downloaded-mark{font-size:18px;margin-top:auto;padding-bottom:4px;user-select:none;cursor:default}

.data-table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:12px}
.data-table th{background:#f5f5fa;padding:8px 10px;text-align:left;border-bottom:2px solid rgba(0,0,0,.06);color:#4a4a65;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.data-table td{padding:6px 10px;border-bottom:1px solid rgba(0,0,0,.04);color:#2a2a3a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.data-table tr:last-child td{border-bottom:none}

.check-btn{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:2px solid #bbb;border-radius:5px;cursor:pointer;margin-right:8px;vertical-align:middle;background:#fff;color:transparent;transition:all .2s;font-size:12px;user-select:none;flex-shrink:0}
.check-btn.checked{background:#2c6e49;border-color:#2c6e49;color:#fff}

.order-cell{display:flex;align-items:center;padding:2px 4px;border-radius:4px;transition:all .2s;overflow:hidden}
.order-cell.highlight{background-color:rgba(44,110,73,.15);font-weight:600;color:#2c6e49}

.buttons-row{display:flex;gap:16px;margin-top:10px}
.btn-download-all, .btn-download-ready{flex:1;height:48px;border-radius:10px;border:none;color:#fff;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.btn-download-all{background:#2c6e49;box-shadow:4px 6px 14px rgba(44,110,73,.3)}
.btn-download-all:hover{background:#358a5a;transform:translateY(-1px)}
.btn-download-ready{background:#3d5a9e;box-shadow:4px 6px 14px rgba(61,90,158,.3)}
.btn-download-ready:hover{background:#4a6cb5;transform:translateY(-1px)}

.empty-state{text-align:center;padding:40px;color:#7a7b90;font-size:14px;background:#fff;border-radius:12px;border:1px dashed rgba(0,0,0,.1)}

.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:2000;animation:fadeIn .2s}
.modal-card{background:#fff;padding:24px 28px;border-radius:16px;max-width:420px;width:90%;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.2);border:1px solid rgba(0,0,0,.08)}
.modal-title{font-size:17px;font-weight:700;color:#2a2a3a;margin-bottom:10px}
.modal-text{font-size:14px;color:#4a4a65;margin-bottom:22px;line-height:1.45}
.modal-btn{height:40px;padding:0 28px;border-radius:10px;border:none;background:#e85a1e;color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;box-shadow:0 4px 12px rgba(232,90,30,.3)}
.modal-btn:hover{background:#ff6f32}

@keyframes fadeIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

#mainWorkspace{display:none}
</style>
</head>
<body>

<a href="https://okkam.space/" class="back-btn" title="Назад">
  <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
</a>

<div class="container">
  <div class="header">
    <div class="header-icon-box">
      <svg viewBox="0 0 100 100">
        <text x="50%" y="55%" dominant-baseline="central" text-anchor="middle" fill="#ffffff" font-size="42" font-weight="900" font-family="sans-serif">X5</text>
      </svg>
    </div>
    <h1>Обработка х5</h1>
    <div class="subtitle">фильтрация, сверка и разделение</div>
  </div>

  <div class="card" id="uploadCard">
    <h2>Загрузка файла</h2>
    <label class="upload-zone" id="dropZone">
      <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
      <br>
      <strong>Нажмите для выбора XLSX файла</strong> или перетащите его сюда
      <input type="file" id="fileInput" accept=".xlsx">
    </label>
    <div id="statusMsg" style="text-align:center;margin-top:12px;font-weight:600;font-size:14px;color:#d9534f"></div>
  </div>

  <div id="mainWorkspace">
    <div id="fileDateInfo" style="display:none"></div>
    <div class="tabs" id="tabsContainer"></div>
    <div class="search-box">
      <input type="text" id="searchInput" class="form-control" placeholder="Поиск по номеру заказа, ФИО водителя, авто и др.">
    </div>
    <div id="groupsContainer"></div>
    
    <div class="buttons-row">
      <button class="btn-download-all" id="btnDownloadAll">📥 Скачать закреплённые строки</button>
      <button class="btn-download-ready" id="btnDownloadReady">✅ Скачать готовые группы</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <div class="modal-title" id="modalTitle">Уведомление</div>
    <div class="modal-text" id="modalText"></div>
    <button class="modal-btn" onclick="closeModal()">Понятно</button>
  </div>
</div>

<script>
let globalData = {};
let currentTabName = '';
const REQUIRED_SHEETS = ["Вход на ПСГ", "Выход с ПСГ"];

const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');
const statusMsg = document.getElementById('statusMsg');
const uploadCard = document.getElementById('uploadCard');
const mainWorkspace = document.getElementById('mainWorkspace');
const tabsContainer = document.getElementById('tabsContainer');
const groupsContainer = document.getElementById('groupsContainer');
const searchInput = document.getElementById('searchInput');
const fileDateInfo = document.getElementById('fileDateInfo');

function showAlert(text, title = 'Уведомление') {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  document.getElementById('modalOverlay').style.display = 'flex';
}
function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

fileInput.addEventListener('change', handleFile);
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.background = '#fff'; });
dropZone.addEventListener('dragleave', e => { dropZone.style.background = ''; });
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.background = ''; if(e.dataTransfer.files.length) { fileInput.files = e.dataTransfer.files; handleFile(); }});

async function handleFile() {
  if (!fileInput.files.length) return;
  statusMsg.textContent = 'Обработка файла...';
  statusMsg.style.color = '#3d5a9e';
  
  const file = fileInput.files[0];
  const dateMatch = file.name.match(/\d{2}\.\d{2}\s*-\s*\d{2}\.\d{2}/);
  if (dateMatch) {
    fileDateInfo.innerHTML = `📁 Файл за: <span>${dateMatch[0]}</span>`;
    fileDateInfo.style.display = 'inline-flex';
  } else {
    fileDateInfo.style.display = 'none';
  }

  const arrayBuffer = await file.arrayBuffer();
  const workbook = new ExcelJS.Workbook();
  
  try {
    await workbook.xlsx.load(arrayBuffer);
    globalData = {};
    let sheetsFound = 0;

    workbook.eachSheet((worksheet) => {
      const name = worksheet.name.trim();
      if (REQUIRED_SHEETS.includes(name)) {
        processSheet(worksheet, name);
        sheetsFound++;
      }
    });

    if (sheetsFound === 0) {
      statusMsg.textContent = 'Ошибка: В файле отсутствуют нужные листы!';
      statusMsg.style.color = '#d9534f';
      return;
    }

    uploadCard.style.display = 'none';
    mainWorkspace.style.display = 'block';
    renderTabs();

  } catch (err) {
    statusMsg.textContent = 'Ошибка чтения файла: ' + err.message;
    statusMsg.style.color = '#d9534f';
  }
}

function processSheet(worksheet, sheetName) {
  let headerCells = [];
  let colWidths = [];
  let rowsData = [];
  
  worksheet.columns.forEach((col, idx) => {
    colWidths[idx + 1] = col.width || 15;
  });

  let orderIdx = -1, driverIdx = -1, rcIdx = -1;

  worksheet.eachRow({ includeEmpty: false }, (row, rowNumber) => {
    if (rowNumber === 1) {
      row.eachCell({ includeEmpty: true }, (cell, colNumber) => {
        headerCells[colNumber] = {
          value: cell.value,
          text: cell.text || '',
          style: cell.style ? JSON.parse(JSON.stringify(cell.style)) : {}
        };
        const lowText = (cell.text || '').toLowerCase();
        if (lowText.includes('номер заказа')) orderIdx = colNumber;
        if (lowText.includes('фио')) driverIdx = colNumber;
        if (lowText.includes('рц псг (первый получатель)')) rcIdx = colNumber;
      });
    } else {
      let rowCells = [];
      let rowVals = [];
      let firstCellColor = 'none';
      
      row.eachCell({ includeEmpty: true }, (cell, colNumber) => {
        if (sheetName === 'Выход с ПСГ' && colNumber === rcIdx) {
          cell.value = null;
          cell.text = '';
        }
        
        const cStyle = cell.style ? JSON.parse(JSON.stringify(cell.style)) : {};
        rowCells[colNumber] = { value: cell.value, text: cell.text || '', style: cStyle };
        rowVals[colNumber] = cell.text || '';

        if (colNumber === 1 && cell.fill) firstCellColor = JSON.stringify(cell.fill);
      });

      if (firstCellColor === 'none') {
        let anyFill = row.getCell(2).fill || row.getCell(3).fill;
        if (anyFill) firstCellColor = JSON.stringify(anyFill);
      }
      
      rowsData.push({ cells: rowCells, vals: rowVals, colorId: firstCellColor, checked: false });
    }
  });
  
  let groups = [];
  let currentGroup = [];
  let lastColor = null;
  let lastDriver = null;

  rowsData.forEach(r => {
    let currentDriver = driverIdx !== -1 ? r.vals[driverIdx] : '';
    if (currentGroup.length === 0) {
      currentGroup.push(r);
    } else {
      if (r.colorId === lastColor && currentDriver === lastDriver) {
        currentGroup.push(r);
      } else {
        groups.push(currentGroup);
        currentGroup = [r];
      }
    }
    lastColor = r.colorId;
    lastDriver = currentDriver;
  });
  if (currentGroup.length > 0) groups.push(currentGroup);

  globalData[sheetName] = { 
    headers: headerCells, 
    colWidths: colWidths,
    groups: groups, 
    orderColIdx: orderIdx,
    driverColIdx: driverIdx
  };
}

function renderTabs() {
  tabsContainer.innerHTML = '';
  let firstTab = true;
  for (let sheetName in globalData) {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (firstTab ? ' active' : '');
    btn.textContent = sheetName;
    btn.onclick = () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTabName = sheetName;
      searchInput.value = '';
      renderGroups();
    };
    tabsContainer.appendChild(btn);
    if (firstTab) { currentTabName = sheetName; firstTab = false; }
  }
  renderGroups();
}

function renderGroups() {
  groupsContainer.innerHTML = '';
  const sheetData = globalData[currentTabName];
  if (!sheetData) return;

  const searchTerm = searchInput.value.toLowerCase().trim();

  let pinnedGroups = [];
  let searchedGroups = [];

  sheetData.groups.forEach((group, index) => {
    group._originalIndex = index;
    if (group.pinned) {
      pinnedGroups.push(group);
    } else if (searchTerm) {
      const isMatch = group.some(row => row.vals.some(val => val && val.toString().toLowerCase().includes(searchTerm)));
      if (isMatch) searchedGroups.push(group);
    }
  });

  const displayGroups = [...pinnedGroups, ...searchedGroups];

  if (displayGroups.length === 0) {
    groupsContainer.innerHTML = `
      <div class="empty-state">
        ${searchTerm ? 'Ничего не найдено по вашему запросу.' : 'Введите данные в поле поиска выше для отображения результатов.'}
      </div>`;
    return;
  }

  let renderIndices = [];
  sheetData.headers.forEach((h, i) => { if (i > 0 && h) renderIndices.push(i); });

  if (currentTabName === "Выход с ПСГ" && sheetData.orderColIdx !== -1 && sheetData.driverColIdx !== -1) {
    renderIndices = renderIndices.filter(i => i !== sheetData.driverColIdx);
    const orderPos = renderIndices.indexOf(sheetData.orderColIdx);
    if (orderPos !== -1) {
      renderIndices.splice(orderPos + 1, 0, sheetData.driverColIdx);
    } else {
      renderIndices.push(sheetData.driverColIdx);
    }
  }

  let colGroupHtml = '<colgroup>';
  renderIndices.forEach(idx => {
    const w = sheetData.colWidths[idx] ? (sheetData.colWidths[idx] * 8.5 + 20) : 100;
    colGroupHtml += `<col style="width:${w}px">`;
  });
  colGroupHtml += '</colgroup>';

  displayGroups.forEach((group) => {
    const groupIdx = group._originalIndex;
    const isAllChecked = group.every(r => r.checked);

    const card = document.createElement('div');
    card.className = 'group-card' + (group.pinned ? ' pinned' : '');
    card.id = `group-${groupIdx}`;

    let tableHtml = `<table class="data-table">${colGroupHtml}<thead><tr>`;
    renderIndices.forEach(idx => { tableHtml += `<th>${sheetData.headers[idx].text}</th>`; });
    tableHtml += `</tr></thead><tbody>`;

    group.forEach((row, rowIdx) => {
      tableHtml += `<tr>`;
      renderIndices.forEach(colIdx => {
        let val = row.vals[colIdx] || '';
        let cellContent = val;
        if (colIdx === sheetData.orderColIdx) {
          const checkedClass = row.checked ? 'checked' : '';
          const bgClass = row.checked ? 'highlight' : '';
          cellContent = `
            <div class="order-cell ${bgClass}" id="cell-${groupIdx}-${rowIdx}">
              <div class="check-btn ${checkedClass}" onclick="toggleCheck(${groupIdx}, ${rowIdx}, this)">✔</div>
              <span style="overflow:hidden;text-overflow:ellipsis">${val}</span>
            </div>`;
        }
        tableHtml += `<td>${cellContent}</td>`;
      });
      tableHtml += `</tr>`;
    });
    tableHtml += `</tbody></table>`;

    card.innerHTML = `
      <div class="group-content">
        ${tableHtml}
      </div>
      <div class="group-actions-sidebar">
        <button class="sidebar-btn btn-pin ${group.pinned ? 'active' : ''}" title="${group.pinned ? 'Открепить' : 'Закрепить'}" onclick="togglePin(${groupIdx})">📌</button>
        <button class="sidebar-btn btn-group-download" title="Скачать эту группу" ${!isAllChecked ? 'disabled' : ''} onclick="downloadGroup(${groupIdx})">📥</button>
        <button class="sidebar-btn btn-remove" title="Удалить из вида" onclick="removeGroup(${groupIdx})">✖</button>
        ${group.downloaded ? '<div class="downloaded-mark" title="Группа скачана">✅</div>' : ''}
      </div>
    `;
    groupsContainer.appendChild(card);
  });
}

searchInput.addEventListener('input', renderGroups);

window.togglePin = function(groupIdx) {
  const group = globalData[currentTabName].groups[groupIdx];
  group.pinned = !group.pinned;
  if (searchInput.value.trim() !== '') searchInput.value = '';
  renderGroups();
};

window.removeGroup = function(groupIdx) {
  globalData[currentTabName].groups.splice(groupIdx, 1);
  renderGroups();
};

window.toggleCheck = function(groupIdx, rowIdx, btnElem) {
  const group = globalData[currentTabName].groups[groupIdx];
  group[rowIdx].checked = !group[rowIdx].checked;
  
  if (searchInput.value.trim() !== '') {
    searchInput.value = '';
    renderGroups();
    return;
  }
  
  const cellDiv = document.getElementById(`cell-${groupIdx}-${rowIdx}`);
  if (group[rowIdx].checked) {
    btnElem.classList.add('checked');
    cellDiv.classList.add('highlight');
  } else {
    btnElem.classList.remove('checked');
    cellDiv.classList.remove('highlight');
  }

  const isAllChecked = group.every(r => r.checked);
  const card = document.getElementById(`group-${groupIdx}`);
  if (card) {
    const dlBtn = card.querySelector('.btn-group-download');
    if (dlBtn) dlBtn.disabled = !isAllChecked;
  }
};

async function exportToXlsx(sheetName, headers, colWidths, rowsData, fileName) {
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(sheetName);

  colWidths.forEach((w, colIdx) => {
    if (w) ws.getColumn(colIdx).width = w;
  });

  const hRow = ws.getRow(1);
  headers.forEach((hCell, colIdx) => {
    if (!hCell) return;
    const c = hRow.getCell(colIdx);
    c.value = hCell.value;
    if (hCell.style) c.style = hCell.style;
  });
  hRow.commit();

  rowsData.forEach((rData, rIdx) => {
    const rowObj = ws.getRow(rIdx + 2);
    rData.cells.forEach((cellData, colIdx) => {
      if (!cellData) return;
      const c = rowObj.getCell(colIdx);
      c.value = cellData.value;
      if (cellData.style) c.style = cellData.style;
    });
    rowObj.commit();
  });

  const buffer = await wb.xlsx.writeBuffer();
  saveAs(new Blob([buffer]), fileName);
}

window.downloadGroup = async function(groupIdx) {
  const sheetData = globalData[currentTabName];
  const group = sheetData.groups[groupIdx];

  if (!group.every(r => r.checked)) {
    showAlert('Скачивание невозможно: в группе проставлены не все галочки!');
    return;
  }

  let fileNameTag = 'Группа';
  const orderNum = sheetData.orderColIdx !== -1 ? group[0].vals[sheetData.orderColIdx] : '';
  if (orderNum) fileNameTag = `Заказ_${orderNum}`;

  await exportToXlsx(currentTabName, sheetData.headers, sheetData.colWidths, group, `${currentTabName}_${fileNameTag}.xlsx`);
  group.downloaded = true;
  renderGroups();
};

document.getElementById('btnDownloadAll').addEventListener('click', async function() {
  const sheetData = globalData[currentTabName];
  if (!sheetData) return;

  const pinnedGroups = sheetData.groups.filter(g => g.pinned);

  if (pinnedGroups.length === 0) {
    showAlert('Нет закреплённых групп! Закрепите с помощью 📌 нужные группы перед скачиванием.');
    return;
  }

  const incomplete = pinnedGroups.filter(g => !g.every(r => r.checked));
  if (incomplete.length > 0) {
    showAlert(`Скачивание невозможно: в закреплённых группах (${incomplete.length} шт.) проставлены не все галочки!`);
    return;
  }

  let allExportRows = [];
  pinnedGroups.forEach(group => { group.forEach(row => allExportRows.push(row)); });

  await exportToXlsx(currentTabName, sheetData.headers, sheetData.colWidths, allExportRows, `${currentTabName}_Закрепленные_строки.xlsx`);
  pinnedGroups.forEach(g => g.downloaded = true);
  renderGroups();
});

document.getElementById('btnDownloadReady').addEventListener('click', async function() {
  const sheetData = globalData[currentTabName];
  if (!sheetData) return;

  const readyGroups = sheetData.groups.filter(g => g.every(r => r.checked));
  if (readyGroups.length === 0) {
    showAlert('Нет полностью готовых групп (где проставлены все галочки) для скачивания!');
    return;
  }

  let allExportRows = [];
  readyGroups.forEach(group => { group.forEach(row => allExportRows.push(row)); });

  await exportToXlsx(currentTabName, sheetData.headers, sheetData.colWidths, allExportRows, `${currentTabName}_Готовые_группы.xlsx`);
  readyGroups.forEach(g => g.downloaded = true);
  renderGroups();
});
</script>
</body>
</html>
