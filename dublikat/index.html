<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дубликат КИТУ</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<style>
@page{size:100mm 50mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-y:scroll}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.06);border-radius:4px}
::-webkit-scrollbar-thumb{background:rgba(61,90,158,.35);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(61,90,158,.55)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#e4e5eb;padding:20px;color:#2a2a3a;-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-print-color-adjust:exact;print-color-adjust:exact}
input,textarea{-webkit-user-select:text;-moz-user-select:text;user-select:text}
img{-webkit-user-drag:none;pointer-events:none}
.container{max-width:900px;margin:0 auto}
.back-btn{position:fixed;top:20px;left:20px;width:46px;height:46px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:7px 9px 20px rgba(30,30,60,.16);transition:all .25s;z-index:1000;text-decoration:none}
.back-btn:hover{background:rgba(61,90,158,.08);transform:translateY(-2px);box-shadow:9px 12px 26px rgba(30,30,60,.22)}
.back-btn:active{transform:translateX(-1px)}
.back-btn svg{width:22px;height:22px;fill:#3d5a9e}
.header{text-align:center;margin-bottom:28px;padding:24px 20px;background:linear-gradient(135deg,#e85a1e,#ff6f32 50%,#ff8855);border-radius:16px;box-shadow:8px 12px 28px rgba(200,70,20,.35);position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 30% 50%,rgba(255,255,255,.1) 0%,transparent 60%);pointer-events:none}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent)}
.header-icon{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.15);backdrop-filter:blur(4px);margin-bottom:12px;border:1px solid rgba(255,255,255,.2);box-shadow:4px 6px 14px rgba(0,0,0,.18);opacity:0;transform:scale(.5);transition:opacity .6s ease,transform .6s cubic-bezier(.34,1.56,.64,1);line-height:1}
.header-icon svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.header-icon.visible{opacity:1;transform:scale(1)}
.header-icon.visible{animation:heartbeat 1.2s ease-in-out .3s 3}
@keyframes heartbeat{0%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}60%{transform:scale(1)}100%{transform:scale(1)}}
.header h1{font-size:25px;color:#fff;font-weight:700;position:relative}
.header .subtitle{font-size:15px;color:rgba(255,255,255,.7);margin-top:6px;position:relative}
.card{background:#f5f5fa;border-radius:16px;padding:28px;margin-bottom:20px;border:1px solid rgba(0,0,0,.06);box-shadow:10px 14px 36px rgba(30,30,60,.18)}
.fg{margin-bottom:20px}
.fg label{display:block;font-size:17px;font-weight:600;margin-bottom:18px;color:#4a4a65;text-transform:uppercase;border-bottom:1px solid rgba(0,0,0,.08);padding-bottom:10px}
.fg textarea{width:100%;height:160px;padding:14px 16px;border:1px solid rgba(0,0,0,.1);border-radius:10px;font-size:11px;background:#dfe0e8;color:#1a1a2e;box-shadow:4px 6px 14px rgba(30,30,60,.14);resize:vertical;font-family:Consolas,Monaco,'Courier New',monospace;line-height:1.6;white-space:pre;overflow-x:auto;letter-spacing:-0.2px}
.fg textarea:focus{outline:none;border-color:#3d5a9e;background:#d8d9e4}
.fg textarea:disabled{opacity:.5;cursor:not-allowed}
.controls-row{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.controls-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn-print{padding:14px 28px;font-size:17px;font-weight:700;background:linear-gradient(135deg,#2c6e49,#3a8f5c);color:#fff;border:none;border-radius:12px;cursor:pointer;box-shadow:6px 8px 20px rgba(44,110,73,.3);transition:all .25s;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.btn-print:hover{transform:translateY(-2px);box-shadow:8px 10px 24px rgba(44,110,73,.4)}
.btn-print:active{transform:translateY(0)}
.btn-preview{width:46px;height:46px;border-radius:12px;border:1.5px solid rgba(61,90,158,.2);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:3px 4px 10px rgba(30,30,60,.08);transition:all .25s;color:#3d5a9e}
.btn-preview:hover{background:rgba(61,90,158,.08);border-color:rgba(61,90,158,.4);transform:translateY(-2px)}
.btn-preview.active{background:#3d5a9e;color:#fff;border-color:#3d5a9e}
.btn-preview svg{width:20px;height:20px;fill:currentColor}
.action-icons{display:flex;gap:8px;align-items:center}
.icon-btn,.btn-timer{height:46px;padding:0 14px;border-radius:12px;border:1.5px solid rgba(61,90,158,.2);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600;box-shadow:3px 4px 10px rgba(30,30,60,.08);transition:all .25s;color:#3d5a9e;white-space:nowrap}
.icon-btn:hover,.btn-timer:hover{background:rgba(61,90,158,.08);border-color:rgba(61,90,158,.4);transform:translateY(-2px)}
.icon-btn.active{background:#3d5a9e;color:#fff;border-color:#3d5a9e;box-shadow:3px 4px 12px rgba(61,90,158,.3)}
.icon-btn svg{width:18px;height:18px;fill:currentColor}
.btn-barcode{min-width:46px;width:46px;height:46px;padding:0;border-radius:12px;border:1.5px solid rgba(61,90,158,.2);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;box-shadow:3px 4px 10px rgba(30,30,60,.08);transition:all .25s;color:#3d5a9e}
.btn-barcode:hover{background:rgba(61,90,158,.08);border-color:rgba(61,90,158,.4);transform:translateY(-2px)}
.btn-timer{border-color:rgba(139,44,44,.3);color:#8b2c2c}
.btn-timer.active{background:#8b2c2c;color:#fff;border-color:#8b2c2c}
.btn-timer .countdown{font-variant-numeric:tabular-nums}
.btn-logo{border-color:rgba(180,120,40,.3);color:#a06820}
.btn-logo.active{background:#a06820;color:#fff;border-color:#a06820;box-shadow:3px 4px 12px rgba(160,104,32,.3)}
.btn-logo svg{width:18px;height:18px;fill:currentColor}
#labels-container{display:none;flex-direction:column;align-items:center;gap:20px;margin-top:20px}
#labels-container.visible{display:flex}
.label{width:100mm;height:50mm;background:#fff;padding:0 3mm 3mm 3mm;display:flex;flex-direction:column;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.1);border:1px solid #ccc;page-break-after:always;page-break-inside:avoid;break-after:page;break-inside:avoid;overflow:hidden}
.label-top{height:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border-bottom:1.5px solid #000;overflow:hidden;position:relative}
.barcode-wrap{width:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.barcode-wrap svg{flex-shrink:0}
.barcode-wrap svg.bc-39{max-height:16mm;width:auto;max-width:100%}
.barcode-wrap svg.bc-128{width:100%!important;height:auto!important;transform:translateY(-4mm)}
.barcode-wrap .mask-128{position:absolute;top:0;left:0;right:0;height:4mm;background:#fff;z-index:2;display:none}
.barcode-wrap.is-128 .mask-128{display:block}
.barcode-wrap.is-128{margin-top:-4mm}
.label-top .barcode-text{font-size:12pt;font-weight:bold;text-align:center;margin-top:1mm;word-break:break-all;line-height:1.1}
.label-bottom{height:50%;display:grid;grid-template-columns:25% 75%;grid-template-rows:1fr 1fr}
.cell{display:flex;align-items:center;justify-content:center;padding:0.5mm 1mm;word-wrap:break-word;overflow:hidden;text-align:center;line-height:1.2}
.cell-tl{border-bottom:1px solid #000;border-right:1px solid #000;font-size:8pt;color:#555}
.cell-bl{border-right:1px solid #000;font-weight:bold;font-size:10pt}
.cell-tr{border-bottom:1px solid #000;font-size:9pt}
.cell-br{font-weight:bold;font-size:10pt}
.logo-overlay{position:absolute;bottom:5mm;right:2mm;width:22mm;height:4mm;pointer-events:none;z-index:10}
.logo-overlay img{width:100%;height:100%;object-fit:contain}
.logo-overlay.hidden{display:none}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:10000;backdrop-filter:blur(4px)}
.modal-overlay.visible{display:flex}
.modal-box{background:#f5f5fa;padding:30px;border-radius:16px;max-width:460px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3);border:1px solid rgba(0,0,0,.06)}
.modal-box p{font-size:15px;margin-bottom:24px;color:#2a2a3a;line-height:1.6}
.modal-box p strong{font-weight:700}
.modal-btns{display:flex;gap:12px;justify-content:center}
.modal-btn{padding:12px 24px;border-radius:10px;border:none;font-weight:600;cursor:pointer;font-size:14px;transition:all .2s}
.modal-btn.confirm{background:#8b2c2c;color:#fff}
.modal-btn.confirm:hover{background:#a03535}
.modal-btn.cancel{background:#dfe0e8;color:#2a2a3a}
.modal-btn.cancel:hover{background:#d0d1dc}
.toast{position:fixed;top:20px;right:20px;padding:14px 22px;border-radius:12px;font-size:14px;font-weight:600;z-index:10001;opacity:0;transform:translateY(-20px);transition:all .3s ease;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.visible{opacity:1;transform:translateY(0)}
.toast.green{background:#2c6e49;color:#fff}
.toast.red{background:#8b2c2c;color:#fff}
@media print{
body{background:#fff;padding:0;margin:0}
.back-btn,.header,.card,.modal-overlay,.toast{display:none!important}
#labels-container{display:flex!important;gap:0;margin:0}
.label{box-shadow:none;border:none;margin:0;page-break-after:always}
}
</style>
</head>
<body>
<a href="http://okkam.space" class="back-btn">
<svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
</a>
<div class="container">
<div class="header">
<div class="header-icon" id="headerIcon">
<svg viewBox="0 0 24 24">
<path d="M3 5v14M6 5v14M10 5v14M12 5v14M15 5v14M19 5v14M21 5v14"/>
</svg>
</div>
<h1>Дубликат КИТУ</h1>
<div class="subtitle">Печать этикеток РТ</div>
</div>
<div class="card">
<div class="fg">
<label>Вставить данные 👇</label>
<textarea id="dataInput" placeholder="Пиво Hollandia ПМ 0,45х24бан лиц 4,8% свет фильт BHOLPM-045C24 00146079472600648794 15.04.1999"></textarea>
</div>
<div class="controls-row">
<div class="controls-left">
<button class="btn-print" id="btnPrint">Печать</button>
<button class="btn-preview" id="btnPreview">
<svg viewBox="0 0 24 24" id="previewIcon"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
</button>
</div>
<div class="action-icons">
<button class="btn-timer active" id="btnAutoClean">🕐 <span class="countdown" id="timerDisplay">Автоочистка</span></button>
<button class="btn-barcode" id="btnBarcode">39</button>
<button class="icon-btn btn-logo active" id="btnLogo">
<svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
</button>
</div>
</div>
</div>
<div id="labels-container"></div>
</div>
<div class="modal-overlay" id="modalOverlay">
<div class="modal-box">
<p><strong>Действительно отключить логотип?</strong><br>Это действие приведёт к потере 10 000 единиц социального рейтинга и недовольству партии<br><strong>Вы будете лишены прав на покупку билетов на самолёт и поезд</strong></p>
<div class="modal-btns">
<button class="modal-btn confirm" id="modalConfirm">Да, отключить</button>
<button class="modal-btn cancel" id="modalCancel">Отмена</button>
</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
let barcodeFormats=['CODE39','CODE128'];
let barcodeLabels=['39','128'];
let currentFormatIndex=0;
let showLogo=true;
let autoCleanActive=true;
let autoCleanTimer=null;
let timeLeft=20;
let previewVisible=false;

const dataInput=document.getElementById('dataInput');
const labelsContainer=document.getElementById('labels-container');
const btnPrint=document.getElementById('btnPrint');
const btnPreview=document.getElementById('btnPreview');
const previewIcon=document.getElementById('previewIcon');
const btnAutoClean=document.getElementById('btnAutoClean');
const timerDisplay=document.getElementById('timerDisplay');
const btnBarcode=document.getElementById('btnBarcode');
const btnLogo=document.getElementById('btnLogo');
const modalOverlay=document.getElementById('modalOverlay');
const modalConfirm=document.getElementById('modalConfirm');
const modalCancel=document.getElementById('modalCancel');
const toast=document.getElementById('toast');
const headerIcon=document.getElementById('headerIcon');

setTimeout(()=>{headerIcon.classList.add('visible')},500);

function showToast(msg,type){
toast.textContent=msg;
toast.className='toast '+type;
setTimeout(()=>toast.classList.add('visible'),10);
setTimeout(()=>{toast.classList.remove('visible')},2500);
}

function resetAutoClean(){
if(!autoCleanActive)return;
clearInterval(autoCleanTimer);
timeLeft=20;
timerDisplay.textContent='20';
autoCleanTimer=setInterval(()=>{
timeLeft--;
timerDisplay.textContent=timeLeft;
if(timeLeft<=0){
dataInput.value='';
clearInterval(autoCleanTimer);
timerDisplay.textContent='Автоочистка';
generateLabels();
}
},1000);
}

dataInput.addEventListener('input',()=>{
if(dataInput.value.trim()){resetAutoClean()}
else{clearInterval(autoCleanTimer);timerDisplay.textContent='Автоочистка'}
generateLabels();
});

dataInput.addEventListener('paste',()=>{
setTimeout(()=>{resetAutoClean();generateLabels()},50);
});

btnAutoClean.addEventListener('click',()=>{
autoCleanActive=!autoCleanActive;
btnAutoClean.classList.toggle('active',autoCleanActive);
if(autoCleanActive&&dataInput.value.trim()){resetAutoClean()}
else{clearInterval(autoCleanTimer);timerDisplay.textContent='Автоочистка'}
});

btnBarcode.addEventListener('click',()=>{
currentFormatIndex=(currentFormatIndex+1)%barcodeFormats.length;
btnBarcode.textContent=barcodeLabels[currentFormatIndex];
generateLabels();
});

btnLogo.addEventListener('click',()=>{
if(showLogo){
modalOverlay.classList.add('visible');
}else{
showLogo=true;
btnLogo.classList.add('active');
showToast('+ уважение партии','green');
generateLabels();
}
});

modalConfirm.addEventListener('click',()=>{
showLogo=false;
btnLogo.classList.remove('active');
modalOverlay.classList.remove('visible');
showToast('потеря уважения партии','red');
generateLabels();
});

modalCancel.addEventListener('click',()=>{
modalOverlay.classList.remove('visible');
});

btnPreview.addEventListener('click',()=>{
previewVisible=!previewVisible;
btnPreview.classList.toggle('active',previewVisible);
if(previewVisible){
previewIcon.innerHTML='<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>';
}else{
previewIcon.innerHTML='<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
}
labelsContainer.classList.toggle('visible',previewVisible&&dataInput.value.trim());
});

btnPrint.addEventListener('click',()=>{
generateLabels();
setTimeout(()=>window.print(),200);
});

function generateLabels(){
labelsContainer.innerHTML='';
const lines=dataInput.value.trim().split('\n');
if(!lines[0]){labelsContainer.classList.remove('visible');return}
const fmt=barcodeFormats[currentFormatIndex];
const is128=fmt==='CODE128';

lines.forEach(line=>{
if(!line.trim())return;
let cols=line.split(/\t/);
if(cols.length<4)cols=line.split(/\s{2,}/);
while(cols.length<4)cols.push('');
const col1=cols[0].trim();
const col2=cols[1].trim();
const col3=cols[2].trim();
const col4=cols[3].trim();

const label=document.createElement('div');
label.className='label';

const top=document.createElement('div');
top.className='label-top';

const wrap=document.createElement('div');
wrap.className='barcode-wrap'+(is128?' is-128':'');

const svgEl=document.createElementNS('http://www.w3.org/2000/svg','svg');
svgEl.setAttribute('class',is128?'bc-128':'bc-39');

wrap.appendChild(svgEl);

if(is128){
const mask=document.createElement('div');
mask.className='mask-128';
wrap.appendChild(mask);
}

top.appendChild(wrap);

const txt=document.createElement('div');
txt.className='barcode-text';
txt.textContent=col3;
top.appendChild(txt);

label.appendChild(top);

const bottom=document.createElement('div');
bottom.className='label-bottom';

const cTL=document.createElement('div');
cTL.className='cell cell-tl';
cTL.innerHTML='Дата<br>производства';

const cBL=document.createElement('div');
cBL.className='cell cell-bl';
cBL.textContent=col4;

const cTR=document.createElement('div');
cTR.className='cell cell-tr';
cTR.textContent=col1;

const cBR=document.createElement('div');
cBR.className='cell cell-br';
cBR.textContent=col2;

bottom.appendChild(cTL);
bottom.appendChild(cTR);
bottom.appendChild(cBL);
bottom.appendChild(cBR);
label.appendChild(bottom);

if(showLogo){
const logo=document.createElement('div');
logo.className='logo-overlay';
logo.innerHTML='<img src="https://static.tildacdn.com/tild3533-3834-4361-a636-646263663031/logo.svg" alt="logo">';
label.appendChild(logo);
}

labelsContainer.appendChild(label);

try{
JsBarcode(svgEl,col3,{
format:fmt,
width:is128?1.5:2,
height:is128?80:60,
displayValue:false,
margin:0
});
}catch(e){
svgEl.remove();
const errTxt=document.createElement('div');
errTxt.style.cssText='font-size:8pt;color:red;text-align:center';
errTxt.textContent='Ошибка: '+col3;
wrap.prepend(errTxt);
}
});

if(previewVisible)labelsContainer.classList.add('visible');
}

document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&e.key==='I')||(e.ctrlKey&&e.key==='u'))e.preventDefault();
});
</script>
</body>
</html>
