<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Поиск GTIN и запрос кодов</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-y:scroll}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.06);border-radius:4px}
::-webkit-scrollbar-thumb{background:rgba(61,90,158,.35);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(61,90,158,.55)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#e4e5eb;padding:20px;color:#2a2a3a}
.container{max-width:900px;margin:0 auto}

.back-btn{position:fixed;top:20px;left:20px;z-index:9999;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border:1px solid rgba(0,0,0,.08);box-shadow:4px 6px 16px rgba(30,30,60,.15);cursor:pointer;transition:all .25s;text-decoration:none}
.back-btn:hover{background:#fff;transform:translateX(-3px);box-shadow:6px 8px 20px rgba(30,30,60,.2)}
.back-btn svg{width:22px;height:22px;fill:#3d5a9e}

.header{text-align:center;margin-bottom:28px;padding:24px 20px;background:linear-gradient(135deg,#e85a1e,#ff6f32 50%,#ff8855);border-radius:16px;box-shadow:8px 12px 28px rgba(200,70,20,.35);position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 30% 50%,rgba(255,255,255,.1) 0%,transparent 60%);pointer-events:none}
.header-icon{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.15);backdrop-filter:blur(4px);margin-bottom:12px;border:1px solid rgba(255,255,255,.2);box-shadow:4px 6px 14px rgba(0,0,0,.18);opacity:0;transform:scale(.5);transition:opacity .6s ease,transform .6s cubic-bezier(.34,1.56,.64,1)}
.header-icon.visible{opacity:1;transform:scale(1)}
.header-icon.visible svg{animation:heartbeat 1.2s ease-in-out .3s 3}
@keyframes heartbeat{0%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}60%{transform:scale(1)}100%{transform:scale(1)}}
.header-icon svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.header h1{font-size:22px;color:#fff;font-weight:700;position:relative}

.card{background:#f5f5fa;border-radius:16px;padding:28px;margin-bottom:20px;border:1px solid rgba(0,0,0,.06);box-shadow:10px 14px 36px rgba(30,30,60,.18)}
.card h2{font-size:15px;margin-bottom:18px;color:#4a4a65;border-bottom:1px solid rgba(0,0,0,.08);padding-bottom:10px;font-weight:600;text-transform:uppercase}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:#555570;text-transform:uppercase}
.fg input{width:100%;padding:14px 16px;border:1px solid rgba(0,0,0,.1);border-radius:10px;font-size:15px;background:#dfe0e8;color:#1a1a2e;box-shadow:4px 6px 14px rgba(30,30,60,.14);transition:all 0.2s}
.fg input:focus{outline:none;border-color:#3d5a9e;background:#d8d9e4}
.fg input:disabled{opacity:.5;cursor:not-allowed}
.fg input.invalid{border-color:#dc2626;background:#fee2e2}

.article-wrapper{position:relative;margin-bottom:20px}
.article-wrapper .card{margin-bottom:0}
.history-side{position:absolute;left:calc(100% + 20px);top:0;width:220px;background:#f5f5fa;border-radius:16px;padding:18px;border:1px solid rgba(0,0,0,.06);box-shadow:10px 14px 36px rgba(30,30,60,.18);max-height:400px;overflow-y:auto}
.history-side h3{font-size:11px;font-weight:600;color:#4a4a65;text-transform:uppercase;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(0,0,0,.08);display:flex;justify-content:space-between;align-items:center}
.history-side .h-clear{cursor:pointer;color:#8b2c2c;font-weight:700;font-size:10px;padding:3px 8px;border-radius:4px;transition:background .2s}
.history-side .h-clear:hover{background:rgba(139,44,44,.1)}
.history-side .h-item{padding:7px 10px;background:rgba(255,255,255,.7);border-radius:6px;font-size:12px;margin-bottom:4px;cursor:pointer;font-family:'Courier New',monospace;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid transparent;transition:all .2s}
.history-side .h-item:hover{background:#fff;border-color:rgba(61,90,158,.3);transform:translateX(3px)}
.history-side .h-empty{font-size:11px;color:#8a8aa5;text-align:center;padding:14px 4px}
@media(max-width:1200px){.history-side{position:static;width:100%;margin-top:16px;max-height:200px}}

.status-box{background:#d8d9e4;border-radius:10px;padding:16px 20px;font-family:'Courier New',monospace;font-size:13px;line-height:1.8;color:#2a2a3a;box-shadow:inset 0 2px 4px rgba(0,0,0,.06),4px 6px 14px rgba(30,30,60,.08);border:1px solid rgba(0,0,0,.05);overflow:hidden;transition:all .3s ease}
.status-line{white-space:pre-wrap;word-break:break-word;color:#2a2a3a;opacity:0;max-height:0;transition:opacity .3s ease,max-height .3s ease,margin .3s ease}
.status-line.visible{opacity:1;max-height:60px;margin-top:2px}
.status-line:first-child.visible{margin-top:0}
.status-line.error{color:#8b2c2c}

.results{display:none;flex-direction:column;gap:16px}
.results.vis{display:flex;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.gtin-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.gtin-row{grid-template-columns:1fr}}
.copy-field{position:relative;background:#fff;border-radius:12px;padding:18px 20px;border:1.5px solid rgba(61,90,158,.15);cursor:pointer;transition:all .25s;box-shadow:4px 6px 14px rgba(30,30,60,.08);user-select:none}
.copy-field:hover{border-color:rgba(61,90,158,.4);transform:translateY(-2px)}
.copy-field .lbl{font-size:11px;font-weight:700;color:#3d5a9e;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.copy-field .val{font-family:'Courier New',monospace;font-size:18px;font-weight:700;color:#1a1a2e;word-break:break-all}
.copy-field .tip{position:absolute;top:10px;right:12px;font-size:10px;color:#7a7a95;text-transform:uppercase}
.copy-field.copied{border-color:#2c6e49;background:rgba(44,110,73,.05)}
.copy-field.copied .lbl{color:#2c6e49}
.info-block{background:#fff;border-radius:12px;padding:20px 24px;border:1px solid rgba(0,0,0,.06);text-align:center;cursor:pointer;transition:all .25s;position:relative}
.info-block:hover{border-color:rgba(61,90,158,.4);transform:translateY(-2px)}
.info-block.copied{border-color:#2c6e49;background:rgba(44,110,73,.05)}
.info-block .lbl{font-size:11px;font-weight:700;color:#7a7a95;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.info-block .val{font-size:15px;color:#2a2a3a;line-height:1.6;text-align:center}
.info-block .tip{position:absolute;top:10px;right:12px;font-size:10px;color:#7a7a95;text-transform:uppercase}
.info-block.copied .lbl{color:#2c6e49}
.empty{text-align:center;padding:30px 20px;color:#8a8aa5;font-size:14px;background:rgba(0,0,0,.03);border-radius:10px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#2c6e49;color:#fff;padding:12px 22px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:1000}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Кастомный счетчик количества */
.qty-control{display:flex;align-items:stretch;height:48px}
.qty-control button{background:#dfe0e8;border:1px solid rgba(0,0,0,.1);color:#2a2a3a;width:48px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.2s, box-shadow 0.2s;box-shadow:4px 6px 14px rgba(30,30,60,.08)}
.qty-control button:hover{background:#d0d1dc}
.qty-control button:first-child{border-right:none;border-radius:10px 0 0 10px}
.qty-control button:last-child{border-left:none;border-radius:0 10px 10px 0}
.qty-control input{border-radius:0;text-align:center;font-weight:700;font-family:'Courier New',monospace;font-size:16px;box-shadow:none !important}

/* UTrace стили */
.utrace-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.btn-orange{display:block;width:100%;padding:16px;background:#e85a1e;color:#fff;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border:none;border-radius:10px;cursor:pointer;transition:all .25s;box-shadow:4px 6px 14px rgba(232,90,30,.25);margin-top:8px}
.btn-orange:hover{background:#d44f15;transform:translateY(-2px);box-shadow:6px 8px 20px rgba(232,90,30,.35)}
.btn-orange:disabled{background:#a0aec0;cursor:not-allowed;transform:none;box-shadow:none}

.utrace-log{margin-top:16px;padding:16px;background:#d8d9e4;border-radius:10px;font-family:'Courier New',monospace;font-size:13px;color:#2a2a3a;box-shadow:inset 0 2px 4px rgba(0,0,0,.06);display:none}
.utrace-step{margin-bottom:6px;opacity:0;animation:slideIn .3s forwards}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.utrace-step.done{color:#2c6e49;font-weight:bold}
.utrace-step.done::before{content:'✓ '}
.utrace-step.loading::before{content:'↻ ';color:#3d5a9e;display:inline-block;animation:spin 1s linear infinite}
.utrace-step.error{color:#dc2626;font-weight:bold}
.utrace-step.error::before{content:'✗ '}
@keyframes spin{100%{transform:rotate(360deg)}}

.highlight{animation:pulse 0.6s ease}
@keyframes pulse{0%{background-color:#bbf7d0;border-color:#2c6e49}100%{background-color:#dfe0e8;border-color:rgba(0,0,0,.1)}}
</style>
</head>
<body>

<a href="http://okkam.space" class="back-btn" title="Назад">
  <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
</a>

<div class="container">
  <div class="header">
    <div class="header-icon" id="headerIcon">
      <svg viewBox="0 0 24 24">
        <circle cx="10" cy="10" r="7"/>
        <line x1="21" y1="21" x2="15" y2="15"/>
        <path d="M10 7v5"/>
        <path d="M8 10l2 2 2-2"/>
      </svg>
    </div>
    <h1>Поиск GTIN и запрос кодов</h1>
  </div>

  <div class="card">
    <h2>Загрузка данных</h2>
    <div class="status-box" id="statusBox">
      <div id="statusLine1" class="status-line"></div>
      <div id="statusLine2" class="status-line"></div>
    </div>
  </div>

  <div class="article-wrapper">
    <div class="card">
      <h2>Артикул</h2>
      <div class="fg">
        <label>Введите значение для поиска</label>
        <input type="text" id="searchInput" placeholder="Введите цифры…" disabled>
      </div>
    </div>
    <div class="history-side" id="historySide">
      <h3>
        <span>История</span>
        <span class="h-clear" onclick="clearHistory()">очистить</span>
      </h3>
      <div id="historyList"><div class="h-empty">Пусто</div></div>
    </div>
  </div>

  <div class="card">
    <h2>Результат</h2>
    <div id="results" class="results">
      <div id="emptyState" class="empty">Введите запрос для поиска</div>
      <div id="notFound" class="empty" style="display:none">Ничего не найдено</div>
      <div id="resultContent" style="display:none;flex-direction:column;gap:16px">
        <div class="gtin-row">
          <div class="copy-field" id="copyGtin" onclick="copyVal('valGtin',this)">
            <div class="lbl">GTIN товара</div>
            <div class="val" id="valGtin"></div>
            <div class="tip">скопировать / выбрать</div>
          </div>
          <div class="copy-field" id="copyGtinPack" onclick="copyVal('valGtinPack',this)">
            <div class="lbl">GTIN упаковки (для перепака)</div>
            <div class="val" id="valGtinPack"></div>
            <div class="tip">скопировать / выбрать (+0)</div>
          </div>
        </div>
        <div class="info-block" id="copyDesc" onclick="copyVal('valDesc',this)">
          <div class="lbl">Наименование</div>
          <div class="val" id="valDesc"></div>
          <div class="tip">скопировать</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Запрос кодов для перепака</h2>
    <div class="utrace-grid">
      <div class="fg">
        <label>GTIN</label>
        <input type="text" id="utraceGtin" placeholder="00000000000000" maxlength="14">
      </div>
      <div class="fg">
        <label>шт</label>
        <div class="qty-control">
          <button type="button" onclick="updateQty(-1)">−</button>
          <input type="text" id="utraceQty" value="1" maxlength="5" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,5)">
          <button type="button" onclick="updateQty(1)">+</button>
        </div>
      </div>
    </div>
    <button id="utraceBtn" class="btn-orange" onclick="startUtraceExport()">Сформировать и скачать</button>
    <div id="utraceLog" class="utrace-log"></div>
  </div>

</div>

<div class="toast" id="toast">Скопировано!</div>

<script>
let DATA = [];
let history = JSON.parse(localStorage.getItem('skuHistory') || '[]');
const FILE_URL = 'https://okkam.space/gtin/SKU%20List_ZFG.xlsx';

document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

document.addEventListener('keydown', function(e) {
  if (e.key === 'F12') { e.preventDefault(); return false; }
  if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) { e.preventDefault(); return false; }
  if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j')) { e.preventDefault(); return false; }
  if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) { e.preventDefault(); return false; }
  if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) { e.preventDefault(); return false; }
});

function hackerText(el, text, cb) {
  const chars = '!@#$%^&*()_+-=[]{}|;:,.<>?/~`0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
  let iter = 0;
  const max = text.length * 2;
  el.classList.add('visible');
  
  const intv = setInterval(() => {
    let out = '';
    for (let i = 0; i < text.length; i++) {
      if (i < Math.floor(iter / 2)) {
        out += text[i];
      } else if (text[i] === ' ') {
        out += ' ';
      } else {
        out += chars[Math.floor(Math.random() * chars.length)];
      }
    }
    el.textContent = out;
    iter++;
    if (iter >= max) { 
      el.textContent = text; 
      clearInterval(intv); 
      if(cb) cb(); 
    }
  }, 20);
}

async function loadFile() {
  const l1 = document.getElementById('statusLine1');
  const l2 = document.getElementById('statusLine2');
  
  hackerText(l1, '★ подключение к Кибербульбергу...', function() {
    setTimeout(function() {
      l1.classList.remove('visible');
      l1.textContent = '';
      
      setTimeout(function() {
        hackerText(l1, '→ База загружена', function() {
          setTimeout(function() {
            const info = '  ✓ OK! Строк: ' + DATA.length + ' | Подключено';
            hackerText(l2, info, function() {
              document.getElementById('searchInput').disabled = false;
              document.getElementById('searchInput').focus();
            });
          }, 100);
        });
      }, 150);
    }, 200);
  });

  try {
    const response = await fetch(FILE_URL);
    const arrayBuffer = await response.arrayBuffer();
    const workbook = XLSX.read(arrayBuffer, { type: 'array' });
    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
    const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
    DATA = jsonData.slice(1); 
  } catch (err) {
    l1.textContent = '✗ Ошибка загрузки файла';
    l1.classList.add('visible', 'error');
  }
}

function validateNumberInput(e) {
  const input = e.target;
  const value = input.value;
  const newValue = value.replace(/[^0-9]/g, '');
  
  if (value !== newValue) {
    input.value = newValue;
    input.classList.add('invalid');
    setTimeout(() => input.classList.remove('invalid'), 500);
  }
}

function copyVal(elementId, fieldEl) {
  const text = document.getElementById(elementId).textContent;
  if (!text || text === '—') return;
  
  if (elementId === 'valGtin' || elementId === 'valGtinPack') {
      const utGtin = document.getElementById('utraceGtin');
      let finalVal = text;
      
      if (elementId === 'valGtinPack') {
          finalVal = '0' + text;
      }
      
      utGtin.value = finalVal;
      utGtin.classList.remove('highlight');
      void utGtin.offsetWidth;
      utGtin.classList.add('highlight');
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      showCopySuccess(fieldEl);
    }).catch(function() {
      fallbackCopy(text, fieldEl);
    });
  } else {
    fallbackCopy(text, fieldEl);
  }
}

function fallbackCopy(text, fieldEl) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.left = '-9999px';
  textarea.style.top = '-9999px';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.focus();
  textarea.select();
  
  try {
    document.execCommand('copy');
    showCopySuccess(fieldEl);
  } catch (err) {
    console.log('Copy failed');
  }
  
  document.body.removeChild(textarea);
}

function showCopySuccess(fieldEl) {
  fieldEl.classList.add('copied');
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  
  setTimeout(function() {
    fieldEl.classList.remove('copied');
    toast.classList.remove('show');
  }, 1500);
}

function doSearch(query) {
  query = query || document.getElementById('searchInput').value.trim();
  if (!query) {
    clearResults();
    return;
  }
  
  const results = document.getElementById('results');
  const emptyState = document.getElementById('emptyState');
  const notFound = document.getElementById('notFound');
  const resultContent = document.getElementById('resultContent');
  
  results.classList.add('vis');
  emptyState.style.display = 'none';
  notFound.style.display = 'none';
  resultContent.style.display = 'none';
  
  let found = null;
  for (let i = 0; i < DATA.length; i++) {
    const row = DATA[i];
    if (row && row[4] !== undefined && String(row[4]).trim().toLowerCase() === query.toLowerCase()) {
      found = row;
      break;
    }
  }
  
  if (found) {
    document.getElementById('valGtin').textContent = found[29] || '—';
    document.getElementById('valGtinPack').textContent = found[30] || '—';
    document.getElementById('valDesc').textContent = found[22] || '—';
    
    if (found[30]) {
        document.getElementById('utraceGtin').value = '0' + found[30];
    } else if (found[29]) {
        document.getElementById('utraceGtin').value = found[29];
    }
    
    resultContent.style.display = 'flex';
    addSuccessfulToHistory(query);
  } else {
    document.getElementById('valGtin').textContent = '—';
    document.getElementById('valGtinPack').textContent = '—';
    document.getElementById('valDesc').textContent = '—';
    notFound.style.display = 'block';
    document.getElementById('utraceGtin').value = '';
  }
}

function clearResults() {
  document.getElementById('valGtin').textContent = '—';
  document.getElementById('valGtinPack').textContent = '—';
  document.getElementById('valDesc').textContent = '—';
  document.getElementById('emptyState').style.display = 'block';
  document.getElementById('notFound').style.display = 'none';
  document.getElementById('resultContent').style.display = 'none';
  document.getElementById('utraceGtin').value = '';
}

function addSuccessfulToHistory(query) {
  query = query.trim();
  if (!query) return;
  
  history = history.filter(h => h.toLowerCase() !== query.toLowerCase());
  history.unshift(query);
  
  if (history.length > 8) {
    history = history.slice(0, 8);
  }
  
  localStorage.setItem('skuHistory', JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById('historyList');
  if (history.length === 0) {
    list.innerHTML = '<div class="h-empty">Пусто</div>';
    return;
  }
  
  let html = '';
  for (let i = 0; i < history.length; i++) {
    html += '<div class="h-item" onclick="selectHistory(\'' + history[i].replace(/'/g, "\\'") + '\')">' + history[i] + '</div>';
  }
  list.innerHTML = html;
}

function selectHistory(query) {
  document.getElementById('searchInput').value = query;
  doSearch(query);
}

function clearHistory() {
  history = [];
  localStorage.setItem('skuHistory', JSON.stringify(history));
  renderHistory();
}

function updateQty(change) {
  const input = document.getElementById('utraceQty');
  let val = parseInt(input.value, 10) || 0;
  val += change;
  if (val < 1) val = 1;
  if (val > 99999) val = 99999;
  input.value = val;
}

async function startUtraceExport() {
  const gtin = document.getElementById('utraceGtin').value.trim();
  const qty = parseInt(document.getElementById('utraceQty').value.trim(), 10);
  const article = document.getElementById('searchInput').value.trim() || 'codes';
  
  const btn = document.getElementById('utraceBtn');
  const logDiv = document.getElementById('utraceLog');

  if (!gtin || isNaN(qty) || qty <= 0) {
      alert('Пожалуйста, укажите GTIN и количество.');
      return;
  }

  btn.disabled = true;
  logDiv.style.display = 'block';
  logDiv.innerHTML = '<div class="utrace-step loading" id="step1">Бронирование кодов...</div>';

  try {
      const resReserve = await fetch('api.php?action=reserve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ gtin, count: qty })
      });
      
      const dataReserve = await resReserve.json();
      if (dataReserve.error) throw new Error(dataReserve.error);
      
      const reqId = dataReserve.reserveId || dataReserve.request_id;
      if (!reqId) throw new Error('Сервер не вернул ID бронирования');

      document.getElementById('step1').className = 'utrace-step done';
      logDiv.innerHTML += '<div class="utrace-step loading" id="step2">Формирование файла...</div>';

      const resExport = await fetch('api.php?action=export&request_id=' + reqId + '&reserveId=' + reqId);
      if (!resExport.ok) throw new Error('Ошибка скачивания файла');
      
      const blob = await resExport.blob();
      const downloadUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = downloadUrl;
      a.download = `${article}.xlsx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(downloadUrl);

      await new Promise(r => setTimeout(r, 1000));

      document.getElementById('step2').className = 'utrace-step done';
      logDiv.innerHTML += '<div class="utrace-step loading" id="step3">Подтверждение получения...</div>';

      const resReceive = await fetch('api.php?action=receive', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ request_id: reqId, reserveId: reqId })
      });
      
      const dataReceive = await resReceive.json();
      if (dataReceive.error) throw new Error(dataReceive.error);

      document.getElementById('step3').className = 'utrace-step done';
      logDiv.innerHTML += '<div class="utrace-step done" style="margin-top:10px;">✨ Успешно завершено!</div>';

  } catch (err) {
      logDiv.innerHTML += `<div class="utrace-step error">Ошибка: ${err.message}</div>`;
  } finally {
      btn.disabled = false;
  }
}

document.addEventListener('DOMContentLoaded', function() {
  renderHistory();
  loadFile();
  
  setTimeout(function() {
    document.getElementById('headerIcon').classList.add('visible');
  }, 500);
  
  document.getElementById('searchInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      doSearch();
    }
  });
  
  document.getElementById('searchInput').addEventListener('input', function(e) {
    validateNumberInput(e);
    clearTimeout(this.searchTimeout);
    const val = this.value;
    this.searchTimeout = setTimeout(function() {
      if (val.trim().length >= 3) {
        doSearch(val);
      }
    }, 300);
  });
});
</script>
</body>
