<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Перепак</title>
<script src="https://cdn.jsdelivr.net/npm/bwip-js@4.1.0/dist/bwip-js-min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style id="base-print-style">
@media print{
  @page{size:57mm 57mm;margin:0;}
}
</style>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-y:scroll}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.06);border-radius:4px}
::-webkit-scrollbar-thumb{background:rgba(61,90,158,.35);border-radius:4px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#e4e5eb;padding:20px;color:#2a2a3a;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
.container{max-width:900px;margin:0 auto;position:relative}
.back-btn{position:fixed;top:20px;left:20px;width:46px;height:46px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:7px 9px 20px rgba(30,30,60,.16);transition:all .25s;z-index:1000;text-decoration:none;border:none;cursor:pointer}
.back-btn:hover{background:rgba(61,90,158,.08);transform:translateY(-2px);box-shadow:9px 12px 26px rgba(30,30,60,.22)}
.back-btn svg{width:24px;height:24px;fill:#3d5a9e}
.header{text-align:center;margin-bottom:28px;padding:24px 20px;background:linear-gradient(135deg,#e85a1e 0%,#ff6f32 50%,#ff8855 100%);border-radius:16px;box-shadow:14px 18px 44px rgba(200,70,20,.35)}
.header-icon{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.15);margin-bottom:12px;border:1px solid rgba(255,255,255,.2);opacity:0;transform:scale(.5);transition:opacity .8s ease,transform .8s cubic-bezier(.34,1.56,.64,1)}
.header-icon.visible{opacity:1;transform:scale(1);animation:floatGlow 3s ease-in-out infinite}
.header-icon svg{width:30px;height:30px;fill:#e63946}
@keyframes floatGlow{
0%,100%{transform:scale(1) translateY(0);box-shadow:0 0 8px rgba(255,255,255,.2),0 4px 12px rgba(0,0,0,.15)}
50%{transform:scale(1) translateY(-6px);box-shadow:0 0 18px rgba(255,255,255,.45),0 8px 20px rgba(0,0,0,.2)}
}
.header h1{font-size:22px;color:#fff;font-weight:700}
.header .subtitle{font-size:13px;color:rgba(255,255,255,.8);margin-top:6px}
.card{background:#f5f5fa;border-radius:16px;padding:28px;margin-bottom:20px;border:1px solid rgba(0,0,0,.06);box-shadow:14px 18px 44px rgba(30,30,60,.2)}
.card h2{font-size:15px;margin-bottom:18px;color:#4a4a65;border-bottom:1px solid rgba(0,0,0,.08);padding-bottom:10px;font-weight:600;text-transform:uppercase}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:#555570;text-transform:uppercase}
.fg input,.fg textarea{width:100%;padding:11px 14px;border:1px solid rgba(0,0,0,.1);border-radius:10px;font-size:14px;background:#dfe0e8;color:#1a1a2e;box-shadow:6px 8px 18px rgba(30,30,60,.16)}
.fg input:focus,.fg textarea:focus{outline:none;border-color:#3d5a9e;background:#d8d9e4}
.fg textarea{font-family:'Courier New',monospace;resize:vertical;min-height:120px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bg{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.bg-left,.bg-right{display:flex;gap:10px;align-items:center}
.btn-pr{height:46px;padding:0 20px;border-radius:12px;border:none;background:#2c6e49;color:#fff;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:7px 9px 22px rgba(44,110,73,.35);transition:all .25s}
.btn-pr:hover{background:#358a5a;transform:translateY(-2px)}
.btn-action{height:46px;padding:0 14px;border-radius:12px;border:1.5px solid rgba(61,90,158,.2);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:7px 9px 20px rgba(30,30,60,.16);transition:all .25s;color:#3d5a9e;font-size:13px;font-weight:600}
.btn-action:hover{background:rgba(61,90,158,.08);transform:translateY(-2px)}
.btn-action svg{width:18px;height:18px;fill:currentColor}
.btn-preview{width:46px;height:46px;border-radius:12px;border:1.5px solid rgba(61,90,158,.2);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:7px 9px 20px rgba(30,30,60,.16);transition:all .25s;color:#3d5a9e}
.btn-preview:hover{background:rgba(61,90,158,.08);transform:translateY(-2px)}
.btn-preview.active{background:#3d5a9e;color:#fff;border-color:#3d5a9e}
.btn-preview svg{width:20px;height:20px;fill:currentColor}
.btn-timer{height:46px;padding:0 14px;border-radius:12px;border:1.5px solid rgba(139,44,44,.2);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600;box-shadow:7px 9px 20px rgba(30,30,60,.16);transition:all .25s;color:#8b2c2c;white-space:nowrap}
.btn-timer:hover{transform:translateY(-2px)}
.btn-timer.active{background:#8b2c2c;color:#fff;border-color:#8b2c2c;box-shadow:7px 9px 22px rgba(139,44,44,.35)}
.btn-timer .countdown{font-variant-numeric:tabular-nums}
.fur{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.fu{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(61,90,158,.08);border:1.5px dashed rgba(61,90,158,.35);border-radius:10px;cursor:pointer;font-size:13px;color:#3d5a9e;font-weight:600}
.fu:hover{background:rgba(61,90,158,.14);transform:translateY(-1px)}
.fu input{display:none}
.fu .fn{color:#2c6e49;font-weight:700}
.frc{font-size:12px;color:#3d5a9e;font-weight:600;background:rgba(61,90,158,.1);padding:4px 10px;border-radius:6px;display:none}
.frc.vis{display:inline-block}
#pa{display:none;flex-direction:column;align-items:center;gap:20px;margin-top:28px}
#pa.vis{display:flex}

.lb-wrap{display:flex;justify-content:center;width:100%}
.lb{width:57mm;height:57mm;position:relative;background:#fff;border-radius:4px;box-shadow:14px 18px 40px rgba(30,30,60,.28);flex-shrink:0;overflow:hidden;box-sizing:border-box}
.lb-inner{width:100%;height:100%;position:relative}

.lb:not(.sz-50x100) .c128{position:absolute;top:3mm;left:4mm;width:49mm;height:14mm}
.lb:not(.sz-50x100) .c128 canvas{width:100%!important;height:100%!important}
.lb:not(.sz-50x100) .c128t{position:absolute;top:17.5mm;left:4mm;width:49mm;text-align:center;font-family:'Courier New',monospace;font-size:16px;font-weight:700;color:#000}
.lb:not(.sz-50x100) .al{position:absolute;top:23.5mm;left:2.5mm;max-width:29mm;font-family:Arial,sans-serif;font-size:15px;color:#000}
.lb:not(.sz-50x100) .at{position:absolute;top:28mm;left:2.5mm;max-width:29mm;font-family:Arial,sans-serif;font-size:16.5px;color:#000;word-break:break-all}
.lb:not(.sz-50x100) .lc{position:absolute;bottom:3.5mm;left:1.5mm;width:27mm;height:11.4mm;overflow:hidden}
.lb:not(.sz-50x100) .lc img{width:100%;height:100%;object-fit:contain;object-position:left bottom;display:block}
.lb:not(.sz-50x100) .dm{position:absolute;bottom:3mm;right:3mm;width:21mm;height:21mm}
.lb:not(.sz-50x100) .dm canvas{width:100%!important;height:100%!important}

.lb.sz-50x100{width:100mm;height:50mm}
.lb.sz-50x100 .c128{position:absolute;top:3mm;left:5mm;width:90mm;height:15mm}
.lb.sz-50x100 .c128 canvas{width:100%!important;height:100%!important}
.lb.sz-50x100 .c128t{position:absolute;top:18.5mm;left:5mm;width:90mm;text-align:center;font-family:'Courier New',monospace;font-size:14px;font-weight:900;color:#000}
.lb.sz-50x100 .extra-txt{position:absolute;top:26mm;left:5mm;width:68mm;height:4.5mm;font-family:Arial,sans-serif;color:#000;line-height:1.15;overflow:hidden;word-break:normal;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lb.sz-50x100 .art-wrap{position:absolute;bottom:3mm;left:5mm;width:22mm;height:16mm;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.lb.sz-50x100 .al{font-family:Arial,sans-serif;font-size:11px;color:#555;font-weight:600}
.lb.sz-50x100 .at{font-family:Arial,sans-serif;font-size:15px;color:#000;font-weight:700;word-break:break-all}
.lb.sz-50x100 .lc{position:absolute;bottom:3mm;left:31.5mm;width:32.5mm;height:16.25mm;overflow:hidden}
.lb.sz-50x100 .lc img{width:100%;height:100%;object-fit:contain;object-position:left bottom;display:block}
.lb.sz-50x100 .dm{position:absolute;bottom:3mm;right:4mm;width:21mm;height:21mm}
.lb.sz-50x100 .dm canvas{width:100%!important;height:100%!important}

@media print{
  html,body{width:auto!important;height:auto!important;margin:0!important;padding:0!important;background:#fff!important;overflow:hidden!important;}
  .header, .card, .back-btn {display:none!important;}
  .container {margin:0!important;padding:0!important;max-width:none!important;width:auto!important;}
  #pa {display:block!important;position:static!important;width:auto!important;margin:0!important;padding:0!important;gap:0!important;}
  
  .lb-wrap {
    page-break-after:always!important;
    break-after:page!important;
    page-break-inside:avoid!important;
    break-inside:avoid!important;
    position:relative!important;
    margin:0!important;
    padding:0!important;
    display:block!important;
  }
  .lb-wrap:last-of-type {page-break-after:avoid!important;break-after:avoid!important;}
  
  .lb {
    position:relative!important;
    border:none!important;
    box-shadow:none!important;
    border-radius:0!important;
    margin:0!important;
    padding:0!important;
    overflow:hidden!important;
    display:block!important;
  }
  
  .lb.sz-50x100 {
    width:100mm!important;
    height:50mm!important;
  }
  
  .lb:not(.sz-50x100) {
    width:57mm!important;
    height:57mm!important;
  }
  
  .lb-inner {
    position:absolute!important;
    left:0!important;
    top:0!important;
    width:100%!important;
    height:100%!important;
    margin:0!important;
    transform:none!important;
  }
}
</style>
</head>
<body>
<a href="http://okkam.space" class="back-btn" title="Назад">
<svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
</a>
<div class="container">
<div class="header">
<div class="header-icon" id="heartIcon"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
<h1>Перепак</h1>
<div class="subtitle">генерация и печать этикеток для перепака мултон</div>
</div>
<div class="card">
<h2>Настройки этикетки</h2>
<div class="fr">
<div class="fg"><label>ШК товара</label><input type="text" id="c128i" placeholder="4600000000001" inputmode="numeric" maxlength="30"></div>
<div class="fg"><label>Артикул товара</label><input type="text" id="arti" placeholder="ART-12345-XYZ" maxlength="30"></div>
</div>
<div class="fg">
<label>Список кодов</label>
<div class="fur">
<label class="fu" for="xf"><span>📂 Загрузить XLSX</span><span class="fn" id="fnm"></span><input type="file" id="xf" accept=".xlsx,.xls"></label>
<span class="frc" id="frc"></span>
</div>
<textarea id="dmi" placeholder="0104601234567890215Gx..."></textarea>
</div>
<div class="bg">
<div class="bg-left">
<button class="btn-pr" id="printBtn">🖨️ Печать</button>
<button class="btn-action" id="sizeToggleBtn" title="Сменить размер этикетки">
<svg viewBox="0 0 24 24"><path d="M3 5v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2zm2 0h14v14H5V5zm3 3h8v2H8V8zm0 4h5v2H8v-2z"/></svg>
<span id="sizeText">57×57 мм</span>
</button>
</div>
<div class="bg-right">
<button class="btn-timer active" id="timerBtn"><span>🕒</span><span class="countdown" id="timerText">Автоочистка</span></button>
<button class="btn-preview" id="previewBtn"><svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg></button>
</div>
</div>
</div>
<div id="pa"></div>
</div>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var LOGO='logo.svg';
var dbt=null;
var acOn=true,acSec=59,acInterval=null;
var previewOn=false;
var userInteracted=false;
var currentSize='57x57';
var skuDict={};

function normalizeBc(bc){
  return String(bc || '').replace(/[^\d]/g, '').trim();
}

fetch(encodeURI('SKU List_ZFG.xlsx'))
  .then(function(res){
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res.arrayBuffer();
  })
  .then(function(ab){
    var wb=XLSX.read(ab,{type:'array'});
    var sh=wb.Sheets[wb.SheetNames[0]];
    var rows=XLSX.utils.sheet_to_json(sh,{header:1,defval:''});
    
    if(!rows || rows.length === 0) return;

    var activeIdx = 0;
    var artIdx = 4;
    var bcIdx = 30;
    var extraIdx = 22;

    var tempSkuMap = {};

    for(var i=1; i<rows.length; i++){
      var row=rows[i];
      if(!row) continue;
      
      var activeVal = String(row[activeIdx] || '').trim().toUpperCase();
      var rawBc = row[bcIdx] !== undefined ? row[bcIdx] : '';
      var rawArt = row[artIdx] !== undefined ? row[artIdx] : '';
      var rawExtra = row[extraIdx] !== undefined ? row[extraIdx] : '';
      
      var bc = normalizeBc(rawBc);
      if(!bc) continue;

      var art = String(rawArt).trim();
      var extra = String(rawExtra).trim();

      if(!tempSkuMap[bc]) tempSkuMap[bc] = [];
      tempSkuMap[bc].push({ active: activeVal, art: art, extra: extra });
    }

    for(var bcKey in tempSkuMap){
      var list = tempSkuMap[bcKey];
      var selected = null;
      if(list.length === 1){
        selected = list[0];
      } else {
        var activeMatches = list.filter(function(item){ return item.active === 'ACTIVE'; });
        if(activeMatches.length > 0){
          selected = activeMatches[0];
        } else {
          selected = list[0];
        }
      }
      skuDict[bcKey] = { art: selected.art, extra: selected.extra };
      skuDict[bcKey.replace(/^0+/, '')] = { art: selected.art, extra: selected.extra };
    }

    if($('c128i').value){
      autoFillArt($('c128i').value);
      debounce(generate);
    }
  })
  .catch(function(err){
    console.error('Ошибка загрузки SKU List_ZFG.xlsx:', err);
  });

function autoFillArt(bc){
  var clean = normalizeBc(bc);
  if(!clean) return;
  var entry = skuDict[clean] || skuDict[clean.replace(/^0+/,'')];
  if(entry && entry.art) $('arti').value = entry.art;
}

function debounce(fn){clearTimeout(dbt);dbt=setTimeout(fn,300)}

setTimeout(function(){$('heartIcon').classList.add('visible')},3000);

document.addEventListener('contextmenu',function(e){e.preventDefault()});
document.addEventListener('keydown',function(e){
  if(e.key==='F12'){e.preventDefault();return false}
  if(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='i'||e.key==='J'||e.key==='j'||e.key==='C'||e.key==='c')){e.preventDefault();return false}
  if(e.ctrlKey&&(e.key==='U'||e.key==='u')){e.preventDefault();return false}
});

$('sizeToggleBtn').addEventListener('click',function(){
  if(currentSize==='57x57'){
    currentSize='50x100';
    $('sizeText').textContent='50×100 мм';
  }else{
    currentSize='57x57';
    $('sizeText').textContent='57×57 мм';
  }
  markInteracted();
  generate();
});

$('c128i').addEventListener('input',function(){
  this.value=this.value.replace(/[^\d]/g,'');
  autoFillArt(this.value);
  markInteracted();
  debounce(generate);
});

$('arti').addEventListener('input',function(){
  markInteracted();
  debounce(generate);
});

$('dmi').addEventListener('input',function(){
  markInteracted();
  debounce(generate);
});

function markInteracted(){
  userInteracted=true;
  if(acOn)startAutoCleanTimer();
}

$('xf').addEventListener('change',function(e){
  var f=e.target.files[0];
  if(!f)return;
  $('fnm').textContent=f.name;
  var r=new FileReader();
  r.onload=function(ev){
    try{
      var wb=XLSX.read(ev.target.result,{type:'binary'});
      var sh=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(sh,{header:1,defval:''});
      
      if(rows.length>=2&&rows[1].length>=2){
        var barcode=String(rows[1][1]||'').trim();
        barcode=barcode.replace(/^0{1,2}/,'');
        if(barcode){
          $('c128i').value=barcode;
          autoFillArt(barcode);
        }
      }
      
      var codes=[];
      for(var i=1;i<rows.length;i++){
        var row=rows[i];
        if(row&&row.length>=3&&row[2]!==''&&row[2]!=null){
          codes.push(String(row[2]).trim());
        }
      }
      $('dmi').value=codes.join('\n');
      $('frc').textContent='✓ '+codes.length+' строк';
      $('frc').classList.add('vis');
      markInteracted();
      generate();
    }catch(err){
      alert('Ошибка чтения файла: '+err.message);
    }
  };
  r.readAsBinaryString(f);
});

function processDM(raw){
  if(!raw)return '';
  var s=String(raw).trim();
  s=s.split('?93').join('\x1D93');
  if(s.charAt(0)!=='\x1D')s='\x1D'+s;
  return s;
}

function renderC128(canvas,text){
  if(!text)return Promise.resolve(false);
  return new Promise(function(resolve){
    try{
      bwipjs.toCanvas(canvas,{bcid:'code128',text:text,scale:2,height:28,includetext:false,backgroundcolor:'FFFFFF'});
      resolve(true);
    }catch(e){resolve(false)}
  });
}

function renderDM(canvas,text){
  if(!text)return Promise.resolve(false);
  return new Promise(function(resolve){
    try{
      bwipjs.toCanvas(canvas,{bcid:'datamatrix',text:text,scale:3,parsefnc:false,backgroundcolor:'FFFFFF'});
      resolve(true);
    }catch(e){resolve(false)}
  });
}

async function generate(){
  var pa=$('pa');
  pa.innerHTML='';
  var bc=$('c128i').value.trim();
  var art=$('arti').value.trim();
  
  var cleanBc = normalizeBc(bc);
  var entry = skuDict[cleanBc] || skuDict[cleanBc.replace(/^0+/,'')] || {};
  var extraText = entry.extra || '';
  if(!art && entry.art) art = entry.art;

  var lines=$('dmi').value.split('\n').map(function(l){return l.trim()}).filter(Boolean);

  if(lines.length===0){
    pa.classList.remove('vis');
    return;
  }

  var dmList=lines.map(processDM);
  var count=dmList.length;

  for(var i=0;i<count;i++){
    var wrap=document.createElement('div');
    wrap.className='lb-wrap';
    
    var lb=document.createElement('div');
    lb.className='lb'+(currentSize==='50x100'?' sz-50x100':'');

    var inner=document.createElement('div');
    inner.className='lb-inner';
    lb.appendChild(inner);

    var c128=document.createElement('div');
    c128.className='c128';
    var c128c=document.createElement('canvas');
    c128.appendChild(c128c);
    inner.appendChild(c128);

    var c128t=document.createElement('div');
    c128t.className='c128t';
    c128t.textContent=bc||'';
    inner.appendChild(c128t);

    if(currentSize==='50x100'){
      if(extraText){
        var et=document.createElement('div');
        et.className='extra-txt';
        et.textContent=extraText;
        inner.appendChild(et);
        
        var fs = 10;
        et.style.fontSize = fs + 'px';
        while(fs > 7 && (et.scrollHeight > et.clientHeight || et.offsetHeight > 18)){
          fs--;
          et.style.fontSize = fs + 'px';
        }
      }

      if(art){
        var artWrap=document.createElement('div');
        artWrap.className='art-wrap';
        
        var al=document.createElement('div');
        al.className='al';
        al.textContent='Артикул:';
        artWrap.appendChild(al);

        var at=document.createElement('div');
        at.className='at';
        at.textContent=art;
        artWrap.appendChild(at);
        
        inner.appendChild(artWrap);
      }
    }else{
      if(art){
        var al=document.createElement('div');
        al.className='al';
        al.textContent='Артикул:';
        inner.appendChild(al);

        var at=document.createElement('div');
        at.className='at';
        at.textContent=art;
        inner.appendChild(at);
      }
    }

    var lc=document.createElement('div');
    lc.className='lc';
    var logoImg=document.createElement('img');
    logoImg.src=LOGO;
    logoImg.alt='МУЛТОН';
    lc.appendChild(logoImg);
    inner.appendChild(lc);

    var dm=document.createElement('div');
    dm.className='dm';
    var dmc=document.createElement('canvas');
    dm.appendChild(dmc);
    inner.appendChild(dm);

    wrap.appendChild(lb);
    pa.appendChild(wrap);

    var results=await Promise.all([
      renderC128(c128c,bc),
      dmList[i]?renderDM(dmc,dmList[i]):Promise.resolve(true)
    ]);

    if(!results[0])c128t.style.color='#c0392b';
    if(!results[1])dm.innerHTML='<div style="font-size:7px;color:#c0392b;padding:1mm;word-break:break-all">DM err</div>';
  }

  if(previewOn)pa.classList.add('vis');
}

$('printBtn').addEventListener('click',async function(){
  var lines=$('dmi').value.split('\n').map(function(l){return l.trim()}).filter(Boolean);
  if(lines.length===0){
    alert('Добавьте коды для печати');
    return;
  }
  
  var printStyle = $('base-print-style');
  if(currentSize==='50x100'){
    printStyle.textContent = '@media print { @page { size: 100mm 50mm; margin: 0; } }';
  }else{
    printStyle.textContent = '@media print { @page { size: 57mm 57mm; margin: 0; } }';
  }
  
  await generate();

  var pa=$('pa');
  pa.classList.add('vis');
  
  setTimeout(function(){
    window.print();
    if(!previewOn){
      setTimeout(function(){pa.classList.remove('vis')},500);
    }
  },200);
});

function startAutoCleanTimer(){
  if(!acOn)return;
  acSec=59;
  updateTimerDisplay();
  clearInterval(acInterval);
  acInterval=setInterval(function(){
    acSec--;
    updateTimerDisplay();
    if(acSec<=0){
      clearAll();
      clearInterval(acInterval);
      acInterval=null;
      userInteracted=false;
      resetTimerDisplay();
    }
  },1000);
}

function updateTimerDisplay(){$('timerText').textContent=acSec+'с'}
function resetTimerDisplay(){$('timerText').textContent='Автоочистка'}

$('timerBtn').addEventListener('click',function(){
  acOn=!acOn;
  if(acOn){
    this.classList.add('active');
    if(userInteracted)startAutoCleanTimer();
    else resetTimerDisplay();
  }else{
    this.classList.remove('active');
    clearInterval(acInterval);
    acInterval=null;
    resetTimerDisplay();
  }
});

$('previewBtn').addEventListener('click',function(){
  previewOn=!previewOn;
  this.classList.toggle('active');
  var pa=$('pa');
  if(previewOn){
    var lines=$('dmi').value.split('\n').map(function(l){return l.trim()}).filter(Boolean);
    if(lines.length>0)pa.classList.add('vis');
  }else{
    pa.classList.remove('vis');
  }
});

function clearAll(){
  $('c128i').value='';
  $('arti').value='';
  $('dmi').value='';
  $('fnm').textContent='';
  $('frc').classList.remove('vis');
  $('xf').value='';
  $('pa').innerHTML='';
  $('pa').classList.remove('vis');
}
})();
</script>
</body>
</html>
