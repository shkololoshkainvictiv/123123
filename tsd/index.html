<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#e4e5eb;color:#2a2a3a;display:flex;flex-direction:column}
input,textarea{-webkit-user-select:text;user-select:text}

.main{flex:1;display:flex;flex-direction:column;padding:14px;gap:10px;overflow-y:auto}

.header{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:linear-gradient(135deg,#e85a1e,#ff6f32);border-radius:12px;box-shadow:4px 6px 16px rgba(200,70,20,.3)}

.fg{margin-bottom:10px}

.qty-control input{border-radius:0;text-align:center;font-weight:700;font-family:'Courier New',monospace;font-size:17px;box-shadow:none !important}

.btn-main{width:100%;padding:16px;background:#e85a1e;color:#fff;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border:none;border-radius:10px;cursor:pointer;transition:all .25s;box-shadow:5px 7px 18px rgba(232,90,30,.3);margin-top:12px}
.btn-main:hover{background:#d44f15;transform:translateY(-2px)}

.btn-main:disabled{background:#a0aec0;cursor:not-allowed;transform:none}

.lb.sz-56x39 .lc{position:absolute;bottom:2mm;left:2mm;width:20mm;height:8.5mm;overflow:hidden}

<body>

<div class="main">
  <div class="header">
    <div>
      <h1>Перепак Мултон</h1>
      <div class="subtitle">Заказ и восстановление кодов</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab-btn active" data-tab="request" onclick="switchTab('request')">Запрос</div>
    <div class="tab-btn" data-tab="recovery" onclick="switchTab('recovery')">Восстановление</div>
  </div>

  <div id="tab-request" class="tab-content active">
    <div class="card">
      <h2>Поиск товара</h2>
      <div class="fg">
        <label>Артикул или GTIN</label>
        <input type="text" id="searchInput" placeholder="Введите артикул или GTIN..." readonly autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="none">
      </div>
      
      <div class="name-display" id="nameDisplay">
        <div class="lbl">Наименование</div>
        <div class="val" id="nameValue">—</div>
      </div>

      <div class="fg" style="margin-top:12px">
        <label>Количество кодов</label>
        <div class="qty-control">
          <button type="button" onclick="updateQty(-1, 'qtyInput')">−</button>
          <input type="text" id="qtyInput" value="" maxlength="5" readonly inputmode="none" placeholder="1">
          <button type="button" onclick="updateQty(1, 'qtyInput')">+</button>
        </div>
      </div>

      <button id="mainBtn" class="btn-main" onclick="startProcess()" disabled>Сформировать</button>
    </div>
  </div>

  <div id="tab-recovery" class="tab-content">
    <div class="card">
      <h2>Восстановление кода</h2>
      
      <div class="recovery-hint">
        <div class="hint-text">Предварительно скопируйте родительский код для печати</div>
      </div>
      
      <button id="recBtn" class="btn-kigu" onclick="startRecovery()">
        <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
        Печать КИГУ
      </button>
    </div>
  </div>
</div>

<div id="pa"></div>

<div class="toast" id="toast">Готово!</div>

<script>
let DATA = [];
let skuDict = {};
let gtinDict = {};
let currentSizeReq = '56x39';
let currentArticle = '';
let currentGtin = '';
let currentName = '';
let currentBc = '';
let currentTab = 'request';
const FILE_URL = 'SKU List_ZFG.xlsx';
const LOGO = 'https://static.tildacdn.com/tild3533-3834-4361-a636-646263663031/logo.svg';

let activeInput = null;

function requestFullscreen() {
  const elem = document.documentElement;
  if (elem.requestFullscreen) {
    elem.requestFullscreen().catch(function() {});
  } else if (elem.webkitRequestFullscreen) {
    elem.webkitRequestFullscreen();
  } else if (elem.msRequestFullscreen) {
    elem.msRequestFullscreen();
  }
}

function hideAddressBar() {
  setTimeout(function() {
    window.scrollTo(0, 1);
  }, 100);
  setTimeout(function() {
    window.scrollTo(0, 0);
  }, 300);
}

let firstInteraction = true;
function handleFirstInteraction() {
  if (!firstInteraction) return;
  firstInteraction = false;
  requestFullscreen();
  hideAddressBar();
  document.removeEventListener('click', handleFirstInteraction);
  document.removeEventListener('keydown', handleFirstInteraction);
  document.removeEventListener('touchstart', handleFirstInteraction);
}
document.addEventListener('click', handleFirstInteraction);
document.addEventListener('keydown', handleFirstInteraction);
document.addEventListener('touchstart', handleFirstInteraction);

document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
document.addEventListener('keydown', function(e) {
  if (e.key === 'F12') { e.preventDefault(); return false; }
  if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) { e.preventDefault(); return false; }
  if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) { e.preventDefault(); return false; }
  
  if (e.key === 'Enter') {
    e.preventDefault();
    if (currentTab === 'request') {
      if (activeInput && activeInput.id === 'searchInput') {
        activeInput = document.getElementById('qtyInput');
        activeInput.focus();
      } else if (activeInput && activeInput.id === 'qtyInput') {
        startProcess();
      }
    }
    return;
  }
  
  if (!activeInput) return;
  
  const isChar = e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey;
  
  if (isChar) {
    e.preventDefault();
    const input = activeInput;
    
    const start = input.selectionStart || 0;
    const end = input.selectionEnd || 0;
    const value = input.value;
    
    let char = e.key;
    if (input.id === 'qtyInput' && !/[0-9]/.test(char)) return;
    
    const newValue = value.substring(0, start) + char + value.substring(end);
    
    const maxLen = parseInt(input.getAttribute('maxlength')) || 100;
    if (newValue.length > maxLen) return;
    
    input.value = newValue;
    input.selectionStart = input.selectionEnd = start + 1;
    input.dispatchEvent(new Event('input', { bubbles: true }));
  } else if (e.key === 'Backspace') {
    e.preventDefault();
    const input = activeInput;
    const start = input.selectionStart || 0;
    const end = input.selectionEnd || 0;
    const value = input.value;
    
    if (start === 0 && end === 0) return;
    
    const newStart = start === end ? start - 1 : start;
    const newValue = value.substring(0, newStart) + value.substring(end);
    input.value = newValue;
    input.selectionStart = input.selectionEnd = newStart;
    input.dispatchEvent(new Event('input', { bubbles: true }));
  } else if (e.key === 'Delete') {
    e.preventDefault();
    const input = activeInput;
    const start = input.selectionStart || 0;
    const end = input.selectionEnd || 0;
    const value = input.value;
    
    if (start === end && start >= value.length) return;
    
    const newStart = start === end ? start + 1 : start;
    const newValue = value.substring(0, start) + value.substring(newStart);
    input.value = newValue;
    input.selectionStart = input.selectionEnd = start;
    input.dispatchEvent(new Event('input', { bubbles: true }));
  } else if (e.key === 'Tab') {
    e.preventDefault();
    if (activeInput.id === 'searchInput') {
      activeInput = document.getElementById('qtyInput');
      activeInput.focus();
    } else {
      activeInput = document.getElementById('searchInput');
      activeInput.focus();
    }
  }
});

document.addEventListener('click', function(e) {
  if (e.target.matches('input[readonly]') || e.target.matches('textarea[readonly]')) {
    activeInput = e.target;
    e.target.focus();
  } else if (e.target.matches('button') || e.target.matches('.tab-btn')) {
    activeInput = null;
  }
});

function normalizeBc(bc) {
  return String(bc || '').replace(/[^\d]/g, '').trim();
}

function normalizeArt(art) {
  return String(art || '').trim().toLowerCase();
}

async function loadDatabase() {
  try {
    const response = await fetch(FILE_URL);
    const arrayBuffer = await response.arrayBuffer();
    const workbook = XLSX.read(arrayBuffer, { type: 'array' });
    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
    const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });
    DATA = jsonData.slice(1);

    const tempSkuMap = {};
    const tempGtinMap = {};
    
    for (let i = 0; i < DATA.length; i++) {
      const row = DATA[i];
      if (!row) continue;
      
      const activeVal = String(row[0] || '').trim().toUpperCase();
      const artVal = String(row[4] || '').trim();
      const bcVal = normalizeBc(row[30]);
      const nameVal = String(row[22] || '').trim();
      
      if (!artVal || !bcVal) continue;
      
      const artKey = normalizeArt(artVal);
      
      if (!tempSkuMap[artKey]) tempSkuMap[artKey] = [];
      tempSkuMap[artKey].push({ active: activeVal, bc: bcVal, name: nameVal, art: artVal });
      
      if (!tempGtinMap[bcVal]) tempGtinMap[bcVal] = [];
      tempGtinMap[bcVal].push({ active: activeVal, bc: bcVal, name: nameVal, art: artVal });
    }
    
    for (let key in tempSkuMap) {
      const list = tempSkuMap[key];
      let selected = null;
      
      if (list.length === 1) {
        selected = list[0];
      } else {
        const activeMatches = list.filter(item => item.active === 'ACTIVE');
        selected = activeMatches.length > 0 ? activeMatches[0] : list[0];
      }
      
      skuDict[key] = { bc: selected.bc, name: selected.name, art: selected.art };
    }
    
    for (let key in tempGtinMap) {
      const list = tempGtinMap[key];
      let selected = null;
      
      if (list.length === 1) {
        selected = list[0];
      } else {
        const activeMatches = list.filter(item => item.active === 'ACTIVE');
        selected = activeMatches.length > 0 ? activeMatches[0] : list[0];
      }
      
      gtinDict[key] = { art: selected.art, name: selected.name, bc: selected.bc };
      
      const stripped = key.replace(/^0+/, '');
      if (stripped !== key) {
        gtinDict[stripped] = { art: selected.art, name: selected.name, bc: selected.bc };
      }
    }
    
    document.getElementById('searchInput').disabled = false;
    document.getElementById('searchInput').focus();
    activeInput = document.getElementById('searchInput');
  } catch (err) {
    console.error('Ошибка загрузки базы:', err);
    alert('Ошибка загрузки базы данных');
  }
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
  
  if (tab === 'request') {
    activeInput = document.getElementById('searchInput');
    document.getElementById('searchInput').focus();
  } else {
    activeInput = null;
  }
}

document.getElementById('searchInput').addEventListener('focus', function() {
  activeInput = this;
});

document.getElementById('qtyInput').addEventListener('focus', function() {
  activeInput = this;
});

function findItem(query) {
  if (!query) return null;
  
  const artKey = normalizeArt(query);
  if (skuDict[artKey]) {
    return { type: 'art', data: skuDict[artKey] };
  }
  
  const cleanQuery = query.replace(/[^\d]/g, '');
  if (cleanQuery) {
    if (gtinDict[cleanQuery]) {
      return { type: 'gtin', data: gtinDict[cleanQuery] };
    }
    
    const stripped = cleanQuery.replace(/^0+/, '');
    if (stripped && gtinDict[stripped]) {
      return { type: 'gtin', data: gtinDict[stripped] };
    }
    
    const withZero = '0' + cleanQuery;
    if (gtinDict[withZero]) {
      return { type: 'gtin', data: gtinDict[withZero] };
    }
  }
  
  return null;
}

document.getElementById('searchInput').addEventListener('input', function(e) {
  const query = this.value.trim();
  const nameDisplay = document.getElementById('nameDisplay');
  const nameValue = document.getElementById('nameValue');
  const mainBtn = document.getElementById('mainBtn');
  
  if (!query) {
    nameDisplay.classList.remove('visible');
    mainBtn.disabled = true;
    this.classList.remove('found');
    currentArticle = '';
    currentGtin = '';
    currentName = '';
    currentBc = '';
    return;
  }
  
  const result = findItem(query);
  
  if (result) {
    currentArticle = result.data.art;
    currentBc = result.data.bc;
    currentGtin = '0' + result.data.bc;
    currentName = result.data.name;
    
    nameValue.textContent = currentName || '—';
    nameDisplay.classList.add('visible');
    mainBtn.disabled = false;
    this.classList.add('found');
  } else {
    nameDisplay.classList.remove('visible');
    mainBtn.disabled = true;
    this.classList.remove('found');
    currentArticle = '';
    currentGtin = '';
    currentName = '';
    currentBc = '';
  }
});

function parseMarkingCode(raw) {
  if (!raw) return null;
  const code = String(raw).trim();
  if (!code) return null;
  
  let gtin = null;
  
  if (code.startsWith('010') && code.length >= 16) {
    const after010 = code.substring(3);
    const digitsMatch = after010.match(/^(\d{13})/);
    if (digitsMatch) {
      const digits = digitsMatch[1];
      const afterDigits = after010.substring(13, 16);
      if (afterDigits === '215') {
        gtin = '0' + digits;
      }
    }
  }
  
  if (!gtin) {
    const idx = code.indexOf('215');
    if (idx >= 13) {
      const potential = code.substring(idx - 13, idx);
      if (/^\d{13}$/.test(potential)) {
        gtin = '0' + potential;
      }
    }
  }
  
  if (!gtin) {
    const digitsOnly = code.replace(/[^\d]/g, '');
    if (digitsOnly.length >= 13) {
      const first13 = digitsOnly.substring(0, 13);
      gtin = '0' + first13;
    }
  }
  
  const dmCode = code + '?93dGVz';
  
  return { gtin, dmCode, originalCode: code };
}

function findItemByGtin(gtin) {
  if (!gtin) return null;
  const cleanGtin = gtin.replace(/[^\d]/g, '');
  
  if (gtinDict[cleanGtin]) return gtinDict[cleanGtin];
  
  const stripped = cleanGtin.replace(/^0+/, '');
  if (gtinDict[stripped]) return gtinDict[stripped];
  
  const withZero = '0' + cleanGtin;
  if (gtinDict[withZero]) return gtinDict[withZero];
  
  return null;
}

document.getElementById('qtyInput').addEventListener('input', function(e) {
  this.value = this.value.replace(/[^0-9]/g, '').slice(0, 5);
});

function updateQty(change, inputId) {
  const input = document.getElementById(inputId);
  let val = parseInt(input.value, 10) || 0;
  val += change;
  if (val < 1) val = 1;
  if (val > 99999) val = 99999;
  input.value = val;
  input.dispatchEvent(new Event('input', { bubbles: true }));
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

async function reserveCodes(gtin, qty) {
  const res = await fetch('api.php?action=reserve', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ gtin: gtin, count: qty })
  });
  
  const data = await res.json();
  
  if (data.error) {
    const err = new Error(data.error);
    if (data.error.includes('401')) {
      err.code = 401;
    }
    throw err;
  }
  
  return data;
}

async function startProcess() {
  const qtyVal = document.getElementById('qtyInput').value.trim();
  const qty = parseInt(qtyVal, 10) || 1;
  
  if (!currentGtin) {
    alert('Введите артикул или GTIN');
    return;
  }
  
  if (qty <= 0) {
    alert('Укажите корректное количество');
    return;
  }
  
  const btn = document.getElementById('mainBtn');
  btn.disabled = true;
  activeInput = null;
  
  try {
    let dataReserve;
    try {
      dataReserve = await reserveCodes(currentGtin, qty);
    } catch (reserveErr) {
      if (reserveErr.code === 401) {
        dataReserve = await reserveCodes(currentGtin, qty);
      } else {
        throw reserveErr;
      }
    }
    
    const reqId = dataReserve.reserveId || dataReserve.request_id;
    if (!reqId) throw new Error('Сервер не вернул ID бронирования');
    
    const resExport = await fetch('api.php?action=export&reserveId=' + reqId);
    if (!resExport.ok) throw new Error('Ошибка скачивания файла');
    
    const arrayBuffer = await resExport.arrayBuffer();
    const workbook = XLSX.read(arrayBuffer, { type: 'array' });
    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
    const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });
    
    const codes = [];
    for (let i = 1; i < jsonData.length; i++) {
      const row = jsonData[i];
      if (row && row.length >= 3 && row[2] !== '' && row[2] != null) {
        codes.push(String(row[2]).trim());
      }
    }
    
    if (codes.length === 0) throw new Error('В файле не найдено кодов');
    
    await generateLabels(currentBc, currentArticle, codes, currentName, currentSizeReq);
    
    const resReceive = await fetch('api.php?action=receive', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reserveId: reqId })
    });
    
    const dataReceive = await resReceive.json();
    if (dataReceive.error) throw new Error(dataReceive.error);
    
    setTimeout(() => {
      window.print();
      showToast('Печать завершена');
      
      setTimeout(() => {
        document.getElementById('searchInput').value = '';
        document.getElementById('qtyInput').value = '';
        document.getElementById('nameDisplay').classList.remove('visible');
        document.getElementById('searchInput').classList.remove('found');
        document.getElementById('pa').innerHTML = '';
        btn.disabled = false;
        currentArticle = '';
        currentGtin = '';
        currentName = '';
        currentBc = '';
        activeInput = document.getElementById('searchInput');
        document.getElementById('searchInput').focus();
      }, 500);
    }, 300);
    
  } catch (err) {
    alert('Ошибка: ' + err.message);
    btn.disabled = false;
    activeInput = document.getElementById('searchInput');
  }
}

async function startRecovery() {
  const btn = document.getElementById('recBtn');
  btn.disabled = true;
  
  try {
    let text = '';
    if (navigator.clipboard && navigator.clipboard.readText) {
      text = await navigator.clipboard.readText();
    } else {
      alert('Буфер обмена недоступен в этом браузере');
      btn.disabled = false;
      return;
    }
    
    if (!text || !text.trim()) {
      alert('Буфер обмена пуст');
      btn.disabled = false;
      return;
    }
    
    const parsed = parseMarkingCode(text.trim());
    
    if (!parsed || !parsed.gtin) {
      alert('Не удалось распознать код маркировки');
      btn.disabled = false;
      return;
    }
    
    const item = findItemByGtin(parsed.gtin);
    
    if (!item) {
      alert('Товар не найден в базе данных');
      btn.disabled = false;
      return;
    }
    
    const bc = parsed.gtin.substring(1);
    const art = item.art;
    const name = item.name;
    const dmCode = parsed.dmCode;
    
    await generateLabels(bc, art, [dmCode], name, '56x39');
    
    setTimeout(() => {
      window.print();
      showToast('Печать завершена');
      
      setTimeout(() => {
        document.getElementById('pa').innerHTML = '';
        btn.disabled = false;
      }, 500);
    }, 300);
    
  } catch (err) {
    alert('Ошибка: ' + err.message);
    btn.disabled = false;
  }
}

function processDM(raw) {
  if (!raw) return '';
  let s = String(raw).trim();
  s = s.split('?93').join('\x1D93');
  if (s.charAt(0) !== '\x1D') s = '\x1D' + s;
  return s;
}

function renderC128(canvas, text) {
  if (!text) return Promise.resolve(false);
  return new Promise(function(resolve) {
    try {
      bwipjs.toCanvas(canvas, { bcid: 'code128', text: text, scale: 2, height: 28, includetext: false, backgroundcolor: 'FFFFFF' });
      resolve(true);
    } catch (e) { resolve(false); }
  });
}

function renderDM(canvas, text) {
  if (!text) return Promise.resolve(false);
  return new Promise(function(resolve) {
    try {
      bwipjs.toCanvas(canvas, { bcid: 'datamatrix', text: text, scale: 3, parsefnc: false, backgroundcolor: 'FFFFFF' });
      resolve(true);
    } catch (e) { resolve(false); }
  });
}

async function generateLabels(bc, art, codes, nameText, size) {
  const pa = document.getElementById('pa');
  pa.innerHTML = '';
  
  const printStyle = document.getElementById('base-print-style');
  if (size === '50x100') {
    printStyle.textContent = '@media print { @page { size: 100mm 50mm; margin: 0; } }';
  } else if (size === '57x57') {
    printStyle.textContent = '@media print { @page { size: 57mm 57mm; margin: 0; } }';
  } else {
    printStyle.textContent = '@media print { @page { size: 56mm 39mm; margin: 0; } }';
  }
  
  const dmList = codes.map(processDM);
  const count = dmList.length;
  
  for (let i = 0; i < count; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'lb-wrap';
    
    const lb = document.createElement('div');
    lb.className = 'lb sz-' + size;
    lb.style.display = 'block';
    
    const inner = document.createElement('div');
    inner.className = 'lb-inner';
    lb.appendChild(inner);
    
    const c128 = document.createElement('div');
    c128.className = 'c128';
    const c128c = document.createElement('canvas');
    c128.appendChild(c128c);
    inner.appendChild(c128);
    
    const c128t = document.createElement('div');
    c128t.className = 'c128t';
    c128t.textContent = bc || '';
    inner.appendChild(c128t);
    
    if (size === '50x100') {
      if (nameText) {
        const et = document.createElement('div');
        et.className = 'extra-txt';
        et.textContent = nameText;
        inner.appendChild(et);
        
        let fs = 10;
        et.style.fontSize = fs + 'px';
        while (fs > 7 && (et.scrollHeight > et.clientHeight || et.offsetHeight > 18)) {
          fs--;
          et.style.fontSize = fs + 'px';
        }
      }
      
      if (art) {
        const artWrap = document.createElement('div');
        artWrap.className = 'art-wrap';
        
        const al = document.createElement('div');
        al.className = 'al';
        al.textContent = 'Артикул:';
        artWrap.appendChild(al);
        
        const at = document.createElement('div');
        at.className = 'at';
        at.textContent = art;
        artWrap.appendChild(at);
        
        inner.appendChild(artWrap);
      }
    } else {
      if (art) {
        const al = document.createElement('div');
        al.className = 'al';
        al.textContent = 'Артикул:';
        inner.appendChild(al);
        
        const at = document.createElement('div');
        at.className = 'at';
        at.textContent = art;
        inner.appendChild(at);
      }
      
      if (nameText) {
        const nm = document.createElement('div');
        nm.className = 'nm';
        nm.textContent = nameText;
        inner.appendChild(nm);
      }
    }
    
    const lc = document.createElement('div');
    lc.className = 'lc';
    const logoImg = document.createElement('img');
    logoImg.src = LOGO;
    logoImg.alt = 'МУЛТОН';
    lc.appendChild(logoImg);
    inner.appendChild(lc);
    
    const dm = document.createElement('div');
    dm.className = 'dm';
    const dmc = document.createElement('canvas');
    dm.appendChild(dmc);
    inner.appendChild(dm);
    
    wrap.appendChild(lb);
    pa.appendChild(wrap);
    
    await Promise.all([
      renderC128(c128c, bc),
      renderDM(dmc, dmList[i])
    ]);
  }
}
